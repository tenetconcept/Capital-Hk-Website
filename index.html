    "privacy": {
      "zh-Hant": {title:"個人私隱政策", body:"<div>\n<p>群益證券(香港)有限公司／群益期貨(香港)有限公司一直致力為客戶提供最佳之服務。要達到此一目的，其中一個途徑就是利用客戶的資料，為客戶提供最方便的途徑，獲得合適的產品和服務，我們亦明白到客戶對於其個人資料的使用非常關注。保護客戶資料乃是我們一直認真處理的事項。<br />\n  <br />\n  因此，群益證券(香港)有限公司／群益期貨(香港)有限公司訂立了以下守則，矢志承諾對客戶的資料保密：<br />\n  <br />\n</p>\n  <div><strong>  無論任何時候，個人名義的客戶均需要向群益證券(香港)有限公司／群益期貨(香港)有限公司提供個人資料(「資料」)，以作個人資料(私隱)條例(《香港法例》第486章)下之用途。有關客戶 的資料(或其他資料)可能用於以下用途：</strong></div>\n<ul>\n    <li>向客戶提供之服務及設施之日常運作；</li>\n    <li>進行信貸審查；</li>\n    <li>協助其他機構進行信貸審查；</li>\n    <li>確保客戶的信用維持良好；</li>\n    <li>設計供客戶使用之金融 服務或相關產品；</li>\n    <li>向客戶推廣金融服務及相關產品；</li>\n    <li>釐定拖欠客戶或客戶拖欠之債務金額；</li>\n	<li>根據任何法例或規例之規定，符合作出披露之要求；</li>\n    <li>及與任何前述部份有關之任何用途。</li>\n  </ul>\n<br />\n\n  <div><strong>  群益證券(香港)有限公司／群益期貨(香港)有限公司持有之客戶有關的資料(及其他資料)將會保密，但群益證券(香港)有限公司／群益期貨(香港)有限公司可向以下人士披露所有資料(及其他資料)，而客戶同意披露所有資料(及其他資料)亦是 群益證券(香港)有限公司／群益期貨(香港)有限公司向客戶提供服務、產品及資料之條件： </strong></div>\n    <ul>\n    <li> 任何向群益證券(香港)有限公司／群益期貨(香港)有限公司提供有關其業務運作之行政、信貸資料、債務追討、電訊、電腦、繳款或其他服務之高級職員、僱員、代理、承包商或第三者； </li>\n     <li>客戶已有或擬與之進行交易之任何金融機構；</li>\n     <li>監管當局及其他有關政府機構；</li>\n     <li>任何有責任為群益證券(香港)有限公司／群益期貨(香港)有限公司保密之其他人士，包括群益證券(香港)有限公司／群益期貨(香港)有限公司以內承諾保持此等資料機密之公司。 </li>\n     <li>群益證券(香港)有限公司／群益期貨(香港)有限公司內公司之間對客戶之資料使用，須依據嚴格之內部安全標準、保密政策及適用法律。</li>\n     <li>我們約束僱員完全遵守該等標準、政策及法律。</li>\n     <li>除為了進行業務、遵守適用法律、保護免受欺詐或作出我們認為可能符合客戶利益之產品及服務優惠外，我們不會將有關客戶的資料分發予其他公司。我們亦可依據適用法律向監管當局及執法人員提供資料。</li>\n     <li>我們訂立了極高標準，以保護客戶的資料免受未經授權之更改或破壞。 </li>\n  </ul><br />\n\n  <p>群益證券(香港)有限公司／群益期貨(香港)有限公司可依據個人資料(私隱)條例及其他適用法律進行以下活動：</p><br />\n\n  <div><strong>  將客戶提供或有關客戶之任何資料或其他資料，與群益證券(香港)有限公司／群益期貨(香港)有限公司或任何其他人士持有之資料(或其他資料)進行配對、比較或交換，以作以下用途：</strong></div>\n  <ul>\n    <li>信貸審查；</li>\n    <li>資料(或其他資料)核對；或</li>\n    <li>提出或核對資料(或其他資料)，該等資料可能用於在任何時候採取對客戶或任何其他人士不利的行動；</li><br /><br />\n  </ul>\n<p>將此等資 料(或其他資料)轉往香港以外任何地方(不論在香港以外處理、持有或使用此等資料(或其他資料)。</p><br />\n  <div><strong>  根據及依據個 人資料(私隱)條例之條款，每位客戶均有權 </strong></div>\n  <ul>\n    <li>檢查群益證券(香港)有限公司／群益期貨(香港)有限公司是否持有有關客戶之資料，及是否有權使用此等資料</li>\n    <li>檢查群益證券(香港)有限公司／群益期貨(香港)有限公司是否持有有關客戶之資料，及是否有權使用此等資料</li>\n    <li>要求群益證券(香港)有限公司／群益期貨(香港)有限公司更改有關客戶之任何錯誤資料；及</li>\n    <li>確定群益證券(香港)有限公司／群益期貨(香港)有限公司有關資料之政策及做法，以及獲知群益證券(香港)有限公司／群益期貨(香港)有限公司持有有關客戶之個人資料種類。</li></ul>\n       <br />\n    查閱及／或改正客戶所提交之任何資料的要求交送交群益證券(香港)有限公司／群益期貨(香港)有限公司。<br /><br />\n    依據個人資料(私隱)條例之條款，群益證券(香港)有限公司／群益期貨(香港)有限公司有權就處理任何資料索取查閱之申請收取合理費用。<br /><br />\n    在群益證券(香港)有限公司／群益期貨(香港)有限公司，有關客戶之資料只會用於進行本身業務的合法用途，以提供優質服務，及進行產品設計及優惠，從而顯示我們明白客戶及其需要。<br /><br />\n    隨著我們會在新科技年代進一步發展新產品和服務，我們會繼續竭力確保客戶的資料會被正確使用及受到適當保護。<br /><br />\n\n  <p>群益證券(香港)有限公司／群益期貨(香港)有限公司，保留一切權利。</p>\n</div>"},
      "zh-Hans": {title:"个人私隐政策", body:"<div>\n    <p>群益证券(香港)有限公司／群益期货(香港)有限公司一直致力为客户提供最佳之服务。要达到此一目的，其中一个途径就是利用客户的资料，为客户提供最方便的途径，获得合适的产品和服务，我们亦明白到客户对於其个人资料的使用非常关注。保护客户资料乃是我们一直认真处理的事项。<br />\n    <br />\n    因此，群益证券(香港)有限公司／群益期货(香港)有限公司订立了以下守则，矢志承诺对客户的资料保密：<br />\n    <br />\n    </p>\n    <div><strong>  无论任何时候，个人名义的客户均需要向群益证券(香港)有限公司／群益期货(香港)有限公司提供个人资料(「资料」)，以作个人资料(私隐)条例(《香港法例》第486章)下之用途。有关客户 的资料(或其他资料)可能用於以下用途： </strong></div>\n    <ul>\n    <li>向客户提供之服务及设施之日常运作； </li>\n    <li>进行信贷审查； </li>\n    <li>协助其他机构进行信贷审查； </li>\n    <li>确保客户的信用维持良好； </li>\n    <li>设计供客户使用之金融服务或相关产品； </li>\n    <li>向客户推广金融服务及相关产品； </li>\n    <li>厘定拖欠客户或客户拖欠之债务金额； </li>\n    <li>根据任何法例或规例之规定，符合作出披露之要求； </li>\n    <li>及与任何前述部份有关之任何用途。 </li>\n    </ul>\n    <br />\n\n    <div><strong>  群益证券(香港)有限公司／群益期货(香港)有限公司持有之客户有关的资料(及其他资料)将会保密，但群益证券(香港)有限公司／群益期货(香港)有限公司可向以下人士披露所有资料(及其他资料)，而客户同意披露所有资料(及其他资料)亦是 群益证券(香港)有限公司／群益期货(香港)有限公司向客户提供服务、产品及资料之条件： </strong></div>\n    <ul>\n    <li>任何向群益证券(香港)有限公司／群益期货(香港)有限公司提供有关其业务运作之行政、信贷资料、债务追讨、电讯、电脑、缴款或其他服务之高级职员、雇员、代理、承包商或第三者； </li>\n    <li>客户已有或拟与之进行交易之任何金融机构； </li>\n    <li>监管当局及其他有关政府机构； </li>\n    <li>任何有责任为群益证券(香港)有限公司／群益期货(香港)有限公司保密之其他人士，包括群益证券(香港)有限公司／群益期货(香港)有限公司以内承诺保持此等资料机密之公司。  </li>\n    <li>群益证券(香港)有限公司／群益期货(香港)有限公司内公司之间对客户之资料使用，须依据严格之内部安全标准、保密政策及适用法律。  </li>\n    <li>我们约束雇员完全遵守该等标准、政策及法律。 </li>\n    <li>除为了进行业务、遵守适用法律、保护免受欺诈或作出我们认为可能符合客户利益之产品及服务优惠外，我们不会将有关客户的资料分发予其他公司。我们亦可依据适用法律向监管当局及执法人员提供资料。 </li>\n    <li>我们订立了极高标准，以保护客户的资料免受未经授权之更改或破坏。 </li>\n    </ul><br />\n\n    <p>群益证券(香港)有限公司／群益期货(香港)有限公司可依据个人资料(私隐)条例及其他适用法律进行以下活动： </p><br />\n\n    <div><strong>  将客户提供或有关客户之任何资料或其他资料，与群益证券(香港)有限公司／群益期货(香港)有限公司或任何其他人士持有之资料(或其他资料)进行配对、比较或交换，以作以下用途：</strong></div>\n    <ul>\n    <li>信贷审查； </li>\n    <li>资料(或其他资料)核对；或 </li>\n    <li>提出或核对资料(或其他资料)，该等资料可能用於在任何时候采取对客户或任何其他人士不利的行动； </li>\n    </ul><br />\n\n    <p>将此等资 料(或其他资料)转往香港以外任何地方(不论在香港以外处理、持有或使用此等资料(或其他资料)。 </p><br />\n\n    <div><strong>  根据及依据个 人资料(私隐)条例之条款，每位客户均有权 </strong></div>\n    <ul>\n    <li>检查群益证券(香港)有限公司／群益期货(香港)有限公司是否持有有关客户之资料，及是否有权使用此等资料 </li>\n    <li>检查群益证券(香港)有限公司／群益期货(香港)有限公司是否持有有关客户之资料，及是否有权使用此等资料 </li>\n    <li>要求群益证券(香港)有限公司／群益期货(香港)有限公司更改有关客户之任何错误资料；及</li>\n    <li>确定群益证券(香港)有限公司／群益期货(香港)有限公司有关资料之政策及做法，以及获知群益证券(香港)有限公司／群益期货(香港)有限公司持有有关客户之个人资料种类。\n    <br /></ul>\n    查阅及／或改正客户所提交之任何资料的要求交送交群益证券(香港)有限公司／群益期货(香港)有限公司。<br /><br />\n    依据个人资料(私隐)条例之条款，群益证券(香港)有限公司／群益期货(香港)有限公司有权就处理任何资料索取查阅之申请收取合理费用。<br /><br />\n    在群益证券(香港)有限公司／群益期货(香港)有限公司，有关客户之资料只会用於进行本身业务的合法用途，以提供优质服务，及进行产品设计及优惠，从而显示我们明白客户及其需要。<br /><br />\n    随着我们会在新科技年代进一步发展新产品和服务，我们会继续竭力确保客户的资料会被正确使用及受到适当保护。 <br /><br />\n    <p>群益证券(香港)有限公司／群益期货(香港)有限公司，保留一切权利。</p>\n    </div>"},
      "en": {title:"Personal Data Privacy", body:"<div>\n<p>We want to provide the best possible service to our customers. One way that we do this is by using customer information to provide our customers with convenient access to the right products and services. We also recognize that our customers highly concern with the use of that information. Safeguarding customer information is a matter that we take seriously. That is why we have set forth the following principles to affirm our long-standing commitment to confidentiality<br />\n  <br />\n</p>\n  <div><strong> From time to time, it is necessary for individual customers to provide us with Personal Data (\"Data\") for the purposes defined under the Personal Data (Privacy) Ordinance (Cap. 486 of the laws of Hong Kong) for which those Data (and other information) may be used are as follows: </strong></div>\n<ul>\n    <li>Providing the daily operation of the services and facilities to customers;</li>\n    <li>conducting credit checks; </li>\n    <li>assisting other institutions to conduct credit checks; ensuring customers' ongoing credit worthiness; </li>\n    <li>designing financial services or related products for customers' use; </li>\n    <li>marketing financial services or related products to customers; </li>\n    <li>determining the amount of indebtedness owed to or by customers; </li>\n    <li>meeting the requirements to make disclosure under the requirements of any rules of law or regulations; </li>\n    <li>and any purposes relating to any of the foregoing. </li>\n<li>and any purposes relating to any of the foregoing. </li>\n  </ul>\n<br />\n\n  <div><strong> Data (and other information) relating to customers held by us will be kept confidential but we may disclose, and it is a condition of providing services, products and information to customers that each customer consents to the disclosure of, all Data (and other information) to: </strong></div>\n    <ul>\n <li>any officer, employee, agent, contractor or third party who provides administrative, credit information, debt collection, telecommunications, computer, payment or other services to us in connection with the operation of their business; </li>\n <li>any financial institution with which the customer has or proposes to have dealings; </li>\n <li>regulatory authorities and other relevant government bodies; </li>\n <li>any other person under a duty of confidentiality to us as well as those companies which has undertaken to keep such information confidential. </li>\n <li>We share information regarding customers only in accordance with strict internal security standards and confidentiality policies and with applicable law. </li>\n <li>We hold our employees fully accountable for adhering to those standards, policies and laws. </li>\n <li>We do not share our customers' information with other companies except in order to conduct our business, comply with applicable law, protect against fraud or make available special offers of products and services that we regard may be of interest to our customers. </li>\n <li>We may also provide information to regulatory authorities and law enforcement officials in accordance with applicable law.  </li>\n <li>We have established high level of standards for protecting our customers' information from unauthorized alteration or destruction. </li>\n\n  </ul><br />\n\n  <p>We may, in accordance with the Personal Data (Privacy) Ordinance and any other applicable law, to:</p><br />\n\n  <div><strong> Match, compare or exchange any Data or other information provided by, or in respect of, a customer with Data (or other information) held by CSC Securities (HK) Limited or any other person for the purpose of: </strong></div>\n  <ul>\n  <li>credit checking;  </li>\n  <li>Data (and other information) verification; </li>\n  <li>otherwise producing or verifying Data (and other information) which may be used for the purpose of taking adverse action against the customer or any other person at any time; </li>\n  <li>transfer such Data (and other information) to any place outside Hong Kong (whether it is for the processing, holding or use of such Data (and other information) outside Hong Kong). </li>\n  </ul>\n<br />\n\n  <p>transfer such Data (and other information) to any place outside Hong Kong (whether for the processing, holding or use of such Data (and other information) outside Hong Kong).  </p><br />\n\n  <div><strong> Under and in accordance with the terms of the Personal Data (Privacy) Ordinance each customer has a right to: </strong></div>\n  <ul>\n    <li>check whether we hold Data about the customer and the right of access to such Data; </li>\n    <li>require us to correct any Data relating to the customer which is inaccurate; and </li>\n    <li>ascertain our policies and practices in relation to Data and to be informed of the kind of customers' personal data which held by us. </li>\n   </li>\n\n    <p>Request for access and/or correct any data that customer has submitted shall be e-mailed to us. For accessing of personal data, please contact the Data Protection Officer:</br></br>\n    Units 3204-07, 32/F., Cosco Tower,</br>\n    Grand Millennium Plaza, 183 Queen's Road Central,</br>\n    Hong Kong</br>\n    Attn.: Legal Compliance Department</br></br>\nIn accordance with the terms of the Personal Data (Privacy) Ordinance, we have the right to charge a reasonable fee for the processing of any Data access request. Information regarding our customers is used solely in the legitimate conduct of our business, to deliver superior service and to design products and special offers that demonstrate our understanding of our customers and their needs. As we move forward in developing new products and services in an era of vast technological change, we will continue to maintain our dedication to assuring that customer information is properly used and appropriately safeguarded.\n    </p>\n</ul>\n</div>"}

    "pro-investor": {
      "zh-Hant": {title:"專業投資者", body:"<div>\"Professional Investor\" is defined in section 1 of Part 1 of Schedule 1 to the SFO. It includes specified entities set out in paragraphs (a) to (i) of the definition (e.g., banks and insurance companies) and persons belonging to a class which is prescribed under the Securities and Futures (Professional Investor) Rules (\"Professional Investor Rules\") (paragraph (j) of the definition).\n<p>\n\"For the avoidance of doubt for the New Professional Regime, we extract summary definitions of Professional Investors from the best of our knowledge.  But we strongly advice if you have any uncertainty or concern regarding the new Professional Investor Regime and wish to obtain any kind of advice, please kindly consult with your legal advisers for better clarification.\"<br />\n</p>\n<p>\nBelow are the extract summary definitions for Professional Investor:-\n</p>\n<p>\nInstitutional Professional Investor \"Please note that in general Professional Investor means i) Institutional Professional Investor- persons falling under paragraphs (a) to (i) of the definition of \"professional investor\" in section 1 of Part 1 of Schedule 1 to the SFO\" :-\n</p>\n<p>\n(a) any recognized exchange company, recognized clearing house, recognized exchange controller or recognized investor compensation company, or any person authorized to provide automated trading services under section 95(2) of this Ordinance;\n</p>\n<p>\n(b) any intermediary, or any other person carrying on the business of the provision of investment services and regulated under the law of any place outside Hong Kong;\n</p>\n<p>\n(c) any authorized financial institution, or any bank which is not an authorized financial institution but is regulated under the law of any place outside Hong Kong;\n</p>\n<p>\n(d) any insurer authorized under the Insurance Companies Ordinance (Cap 41), or any other person carrying on insurance business and regulated under the law of any place outside Hong Kong;\n</p>\n<p>\n(e) any scheme which-<br>\n(i) is a collective investment scheme authorized under section 104 of this Ordinance; or<br>\n(ii) is similarly constituted under the law of any place outside Hong Kong and, if it is regulated under the law of such place, is permitted to be operated under the law of such place, or any person by whom any such scheme is operated;\n</p>\n<p>\n(f) any registered scheme as defined in section 2(1) of the Mandatory Provident Fund Schemes Ordinance(Cap 485), or its constituent fund as defined in section 2 of the Mandatory Provident Fund Schemes(General) Regulation (Cap 485 sub. leg. A), or any person who, in relation to any such registered scheme, is an approved trustee or service provider as defined in section 2(1) of that Ordinance or who is an investment manager of any such registered scheme or constituent fund;\n</p>\n<p>\n(g) any scheme which-<br>\n(i) is a registered scheme as defined in section 2(1) of the Occupational Retirement Schemes Ordinance (Cap 426); or<br>\n(ii) is an offshore scheme as defined in section 2(1) of that Ordinance and, if it is regulated under the law of the place in which it is domiciled, is permitted to be operated under the law of such place, or any person who, in relation to any such scheme, is an administrator as defined in section 2(1) of that Ordinance;\n</p>\n<p>\n(h) any government (other than a municipal government authority), any institution which performs the functions of a central bank, or any multilateral agency;\n</p>\n<p>\n(i) except for the purposes of Schedule 5 to this Ordinance, any corporation which is-<br>\n<ol>\n(i) a wholly owned subsidiary of-<br>\n(A) an intermediary, or any other person carrying on the business of the provision of<br>\ninvestment services and regulated under the law of any place outside Hong Kong; or<br>\n(B) an authorized financial institution, or any bank which is not an authorized financial institution but is regulated under the law of any place outside Hong Kong;<br>\n(ii) a holding company which holds all the issued share capital of-<br>\n(A) an intermediary, or any other person carrying on the business of the provision of\ninvestment services and regulated under the law of any place outside Hong Kong; or<br>\n(B) an authorized financial institution, or any bank which is not an authorized financial institution but is regulated under the law of any place outside Hong Kong; or any person of a class which is prescribed by rules made under section 397 of this Ordinance for the purposes of this paragraph as within the meaning of this definition for the purposes of the provisions of this Ordinance, or to the extent that it is prescribed by rules so made as within the meaning of this definition for the purposes of any provision of this Ordinance;<br>\nii) Corporate Professional Investors- trust corporations, corporations or partnerships falling under sections 3(a), (c) and (d) of the Professional Investor Rules; and iii) Individual Professional Investors- Falling under Section 3(b) of the Securities and Futures Professional Investors Rules:-\n<br>\n(b) any individual, either alone or with any of his or her associates on a joint account, having a portfolio of not less than $8 million or its equivalent in any foreign currency at the relevant date or- (L.N. 135 of 2011)<br>\n(i) as stated in a certificate issued by an auditor or a certified public accountant of the individual within 12 months before the relevant date; or (23 of 2004 s. 56)<br>\n(ii) as ascertained by referring to one or more custodian statements issued to the individual (either alone or with the associate) within 12 months before the relevant date;\n</ol>\n</p>\n<p>\nFor Corporate Professional Investors such as Trust Corporations, Corporations or<br>\nPartnerships meeting specified monetary Thresholds:-\n</p>\n<p>\n(a) any trust corporation having been entrusted under the trust or trusts of which it acts as a trustee with total assets of not less than $40 million or its equivalent in any foreign currency at the relevant date or- (L.N. 135 of 2011)<br>\n(i) as stated in the most recent audited financial statement prepared-<br>\n(A) in respect of the trust corporation; and<br>\n(B) within 16 months before the relevant date;<br>\n(ii) as ascertained by referring to one or more audited financial statements, each being the most recent audited financial statement, prepared-<br>\n(A) in respect of the trust or any of the trusts; and<br>\n(B) within 16 months before the relevant date; or<br>\n(iii) as ascertained by referring to one or more custodian statements issued to the trust corporation-<br>\n(A) in respect of the trust or any of the trusts; and<br>\n(B) within 12 months before the relevant date;\n</p>\n<p>\n(c) any corporation or partnership having-<br>\n(i) a portfolio of not less than $8 million or its equivalent in any foreign currency; or<br>\n(ii) total assets of not less than $40 million or its equivalent in any foreign currency,<br>\nat the relevant date, or as ascertained by referring to- (L.N. 135 of 2011)<br>\n(iii) the most recent audited financial statement prepared-<br>\n(A) in respect of the corporation or partnership (as the case may be); and<br>\n(B) within 16 months before the relevant date; or<br>\n(iv) one or more custodian statements issued to the corporation or partnership (as the case may be) within 12 months before the relevant date; and\n</p>\n<p>\nFor Corporate Professional Investors that Corporate Investment Vehicles wholly owned by Individual Professional Investors or Corporate Professional Investors:-\n</p>\n<p>\n(d) any corporation the sole business of which at the relevant date is to hold investments and which at the relevant date is wholly owned by any one or more of the following persons-<br>\n(i) a trust corporation that falls within the description in paragraph (a);<br>\n(ii) an individual who, either alone or with any of his or her associates on a joint account, falls within the description in paragraph (b);<br>\n(iii) a corporation that falls within the description in paragraph (c);<br>\n(iv) a partnership that falls within the description in paragraph (c). (L.N. 135 of 2011)\n</p>\n</div>"},

      "zh-Hant": {title:"群益觀點", body:"<br />\n<table background=\"/images/img004.gif\">\n <form method=\"POST\" action=\"HKpaper.aspx\" name=\"searchForm\" >\n  <tr>\n    <td><img src=\"https://www.e-capital.com.hk/images/icon003.png\" hspace=\"15\" />&nbsp;&nbsp;新聞檢索</td>\n    <td><label>\n      <input type=\"text\" name=\"xkeyword\" />\n      </label>\n    </td>\n    <td>&nbsp;</td>\n    <td><input type=\"image\" name=\"submit\" src=\"https://www.e-capital.com.hk/images/btn_002.gif\" />\n    </td>\n    <td>&nbsp;</td>\n  </tr>\n  </form>\n</table>\n\n            <table>\n            <tr>\n            <td colspan=\"3\"><p><img src=\"https://www.e-capital.com.hk/images/icon_0011.gif\" hspace=\"5\">\n            <a href=\"https://www.e-capital.com.hk/report/HKpaper_page.aspx?NID=9FCF6F8F-5AB9-4FDB-A920-665A53F24693\" >香港商報&nbsp;&nbsp;恒指反覆下測19600點</a>&nbsp;(2016-06-17)\n\n            </p>            </td>\n            </tr>\n            <tr>\n            <td>\n            <table>\n            <tr>\n            <td>\n\n                           <a href=\"https://www.e-capital.com.hk/report/HKpaper_page.aspx?NID=9FCF6F8F-5AB9-4FDB-A920-665A53F24693\" >\n                           <img src=\"http://www.e-capital.com.hk/support/newspaper/{9FCF6F8F-5AB9-4FDB-A920-665A53F24693}/20160617%20-%20%e9%a6%99%e6%b8%af%e5%95%86%e5%a0%b1.jpg\" hspace=\"0\"></a>\n                                    </td>\n            </tr>\n            </table>\n            </td>\n            <td>&nbsp;</td>\n            <td><p>當下國際金融市場聚焦的三大事件-A股能否納進MSCI、聯儲局6月議息聲明內容、以及英國的脫歐公投結果，自本周三起陸續揭盎，A股最終未能[入摩]並未完全令市場感意外，而聯儲局理事於加息態度轉趨保守，亦大致屬於市場預期之內，目前最令市場感困擾或感最不明朗的，便是本月23日（下週四）的英國脫歐公投結果，故在公投之前，預計市場普遍將充斥審慎情緒，恆生指數短線面臨反覆下測19600點壓力。<a href=\"https://www.e-capital.com.hk/report/HKpaper_page.aspx?NID=9FCF6F8F-5AB9-4FDB-A920-665A53F24693\">more>></a></p></td>\n            </tr>\n\n            <tr>\n            <td colspan=\"3\" >            </td>\n            </tr>\n\n            </table>\n\n            <table>\n            <tr>\n            <td colspan=\"3\"><p><img src=\"https://www.e-capital.com.hk/images/icon_0011.gif\" hspace=\"5\">\n            <a href=\"https://www.e-capital.com.hk/report/HKpaper_page.aspx?NID=D87ADE7F-1D29-4B30-AD09-8DE1B2E907ED\" >經濟日報&nbsp;&nbsp;置富產業信託 (778.HK)及香港電訊-SS (6823)</a>&nbsp;(2016-06-17)\n\n            </p>            </td>\n            </tr>\n            <tr>\n            <td>\n            <table>\n            <tr>\n            <td>\n\n                           <a href=\"https://www.e-capital.com.hk/report/HKpaper_page.aspx?NID=D87ADE7F-1D29-4B30-AD09-8DE1B2E907ED\" >\n                           <img src=\"http://www.e-capital.com.hk/support/newspaper/{D87ADE7F-1D29-4B30-AD09-8DE1B2E907ED}/20160617%20-%20%e7%b6%93%e6%bf%9f%e6%97%a5%e5%a0%b1.jpg\" hspace=\"0\"></a>\n                                    </td>\n            </tr>\n            </table>\n            </td>\n            <td>&nbsp;</td>\n            <td><p>聯儲局6月議息會聲明，引導市場普遍重燃對環球經濟前景關注，加上英國下週四脫歐公投，港股短線反覆偏淡。<a href=\"https://www.e-capital.com.hk/report/HKpaper_page.aspx?NID=D87ADE7F-1D29-4B30-AD09-8DE1B2E907ED\">more>></a></p></td>\n            </tr>\n\n            <tr>\n            <td colspan=\"3\" >            </td>\n            </tr>\n\n            </table>\n\n            <table>\n            <tr>\n            <td colspan=\"3\"><p><img src=\"https://www.e-capital.com.hk/images/icon_0011.gif\" hspace=\"5\">\n            <a href=\"https://www.e-capital.com.hk/report/HKpaper_page.aspx?NID=669F2F31-F648-4792-A3D3-D8B63DF9FD1A\" >文匯報&nbsp;&nbsp;5月貨幣數據對A股正面</a>&nbsp;(2016-06-16)\n\n            </p>            </td>\n            </tr>\n            <tr>\n            <td>\n            <table>\n            <tr>\n            <td>\n\n                           <a href=\"https://www.e-capital.com.hk/report/HKpaper_page.aspx?NID=669F2F31-F648-4792-A3D3-D8B63DF9FD1A\" >\n                           <img src=\"http://www.e-capital.com.hk/support/newspaper/{669F2F31-F648-4792-A3D3-D8B63DF9FD1A}/20160616%20-%20Wen%20Wei%20Po.jpg\" hspace=\"0\"></a>\n                                    </td>\n            </tr>\n            </table>\n            </td>\n            <td>&nbsp;</td>\n            <td><p>MSCI週三發佈Ａ股是否被納進旗下新興市場指數的結果，儘管是次A股再次未能&#65339;入摩&#65341;，但消息未有對A股產生任何不利影響。一方面，市場近日已對這項結果有所影響(本週一Ａ股大幅回落)，另一方面，市場轉而把注意力集中至&#65339;深港股&#65341;政策會否於短期內出台，&#65339;深港通&#65341;憧憬再度發酵成為激勵A股昨天表現的主要利多因素。<a href=\"https://www.e-capital.com.hk/report/HKpaper_page.aspx?NID=669F2F31-F648-4792-A3D3-D8B63DF9FD1A\">more>></a></p></td>\n            </tr>\n\n            <tr>\n            <td colspan=\"3\" >            </td>\n            </tr>\n\n            </table>\n\n            <table>\n            <tr>\n            <td colspan=\"3\"><p><img src=\"https://www.e-capital.com.hk/images/icon_0011.gif\" hspace=\"5\">\n            <a href=\"https://www.e-capital.com.hk/report/HKpaper_page.aspx?NID=BE7813E1-EC19-4B1F-A8AF-E432F9B88176\" >經濟日報&nbsp;&nbsp;領展房產基金 (823.HK)及價值黃金ETF(3081)</a>&nbsp;(2016-06-15)\n\n            </p>            </td>\n            </tr>\n            <tr>\n            <td>\n            <table>\n            <tr>\n            <td>\n\n                           <a href=\"https://www.e-capital.com.hk/report/HKpaper_page.aspx?NID=BE7813E1-EC19-4B1F-A8AF-E432F9B88176\" >\n                           <img src=\"http://www.e-capital.com.hk/support/newspaper/{BE7813E1-EC19-4B1F-A8AF-E432F9B88176}/20160615%20-%20%e7%b6%93%e6%bf%9f%e6%97%a5%e5%a0%b1.jpg\" hspace=\"0\"></a>\n                                    </td>\n            </tr>\n            </table>\n            </td>\n            <td>&nbsp;</td>\n            <td><p>市場注意力集中於本6月23日英國脫歐公投結果，預料在此之前市場避險情緒將有增無減，恆指短線反覆偏弱。<a href=\"https://www.e-capital.com.hk/report/HKpaper_page.aspx?NID=BE7813E1-EC19-4B1F-A8AF-E432F9B88176\">more>></a></p></td>\n            </tr>\n\n            <tr>\n            <td colspan=\"3\" >            </td>\n            </tr>\n\n            </table>\n\n            <table>\n            <tr>\n            <td colspan=\"3\"><p><img src=\"https://www.e-capital.com.hk/images/icon_0011.gif\" hspace=\"5\">\n            <a href=\"https://www.e-capital.com.hk/report/HKpaper_page.aspx?NID=44BBC266-AFB3-425E-892A-5F6A51CB5CC7\" >文匯報&nbsp;&nbsp;A股是否入摩影響不大</a>&nbsp;(2016-06-15)\n\n            </p>            </td>\n            </tr>\n            <tr>\n            <td>\n            <table>\n            <tr>\n            <td>\n\n                           <a href=\"https://www.e-capital.com.hk/report/HKpaper_page.aspx?NID=44BBC266-AFB3-425E-892A-5F6A51CB5CC7\" >\n                           <img src=\"http://www.e-capital.com.hk/support/newspaper/{44BBC266-AFB3-425E-892A-5F6A51CB5CC7}/20160615%20-%20Wen%20Wei%20Po.jpg\" hspace=\"0\"></a>\n                                    </td>\n            </tr>\n            </table>\n            </td>\n            <td>&nbsp;</td>\n            <td><p>本文出刊之時，相信A股是否納進MSCI的結果將揭盎，不過，市場主流看法為：無論A股是次能否成功[入摩]，對A股市場的影響將會屬短暫性或程度有限。儘管市場近期對Ａ股&#65339;入摩&#65341;將激勵市場的憧憬已明顯降溫，但滬深股市於結果發佈前夕回穩，證券及銀行股類支撐大盤回升，較可惜的是，大盤整體上升動能不足。<a href=\"https://www.e-capital.com.hk/report/HKpaper_page.aspx?NID=44BBC266-AFB3-425E-892A-5F6A51CB5CC7\">more>></a></p></td>\n            </tr>\n\n            <tr>\n            <td colspan=\"3\" >            </td>\n            </tr>\n\n            </table>\n<br>\n            <div>\n            <span class='navFx'>第一頁</span> | <span class='navPx'>上一頁</span> | <span class='navMain'>目前為第 1/422 頁</span> | <a href='/report/HKpaper.aspx?navNextPage=2' class='navN'>下一頁</a> | <a href='/report/HKpaper.aspx?navNextPage=422' class='navL'>最後一頁</a>\n			</div>"},
      "zh-Hans": {title:"群益观点", body:"<br />\n<table background=\"/cn/images/img004.gif\">\n <form method=\"POST\" action=\"HKpaper.aspx\" name=\"searchForm\" >\n  <tr>\n    <td><img src=\"https://www.e-capital.com.hk/cn/images/icon003.png\" hspace=\"15\" />&nbsp;&nbsp;新闻检索</td>\n    <td><label>\n      <input type=\"text\" name=\"xkeyword\" />\n      </label>\n    </td>\n    <td>&nbsp;</td>\n    <td><input type=\"image\" name=\"submit\" src=\"https://www.e-capital.com.hk/cn/images/btn_002_cn.gif\" />\n    </td>\n    <td>&nbsp;</td>\n  </tr>\n  </form>\n</table>\n\n            <table>\n            <tr>\n            <td colspan=\"3\"><p><img src=\"https://www.e-capital.com.hk/cn/images/icon_0011.gif\" hspace=\"5\">\n            <a href=\"https://www.e-capital.com.hk/cn/report/HKpaper_page.aspx?NID=9FCF6F8F-5AB9-4FDB-A920-665A53F24693\" >香港商报&nbsp;&nbsp;恒指反覆下测19600点</a>&nbsp;(2016-06-17)\n\n            </p>            </td>\n            </tr>\n            <tr>\n            <td>\n            <table>\n            <tr>\n            <td>\n\n                           <a href=\"https://www.e-capital.com.hk/cn/report/HKpaper_page.aspx?NID=9FCF6F8F-5AB9-4FDB-A920-665A53F24693\" >\n                           <img src=\"http://www.e-capital.com.hk/support/newspaper/{9FCF6F8F-5AB9-4FDB-A920-665A53F24693}/20160617%20-%20%e9%a6%99%e6%b8%af%e5%95%86%e5%a0%b1.jpg\" hspace=\"0\"></a>\n                                    </td>\n            </tr>\n            </table>\n            </td>\n            <td>&nbsp;</td>\n            <td><p>当下国际金融市场聚焦的三大事件-A股能否纳进MSCI、联储局6月议息声明内容、以及英国的脱欧公投结果，自本周三起陆续揭盎，A股最终未能[入摩]并未完全令市场感意外，而联储局理事於加息态度转趋保守，亦大致属於市场预期之内，目前最令市场感困扰或感最不明朗的，便是本月23日（下周四）的英国脱欧公投结果，故在公投之前，预计市场普遍将充斥审慎情绪，恒生指数短线面临反覆下测19600点压力。<a href=\"https://www.e-capital.com.hk/cn/report/HKpaper_page.aspx?NID=9FCF6F8F-5AB9-4FDB-A920-665A53F24693\">more>></a></p></td>\n            </tr>\n\n            <tr>\n            <td colspan=\"3\" ></td>\n            </tr>\n\n            </table>\n\n            <table>\n            <tr>\n            <td colspan=\"3\"><p><img src=\"https://www.e-capital.com.hk/cn/images/icon_0011.gif\" hspace=\"5\">\n            <a href=\"https://www.e-capital.com.hk/cn/report/HKpaper_page.aspx?NID=D87ADE7F-1D29-4B30-AD09-8DE1B2E907ED\" >经济日报&nbsp;&nbsp;置富产业信托 (778.HK)及香港电讯-SS (6823)</a>&nbsp;(2016-06-17)\n\n            </p>            </td>\n            </tr>\n            <tr>\n            <td>\n            <table>\n            <tr>\n            <td>\n\n                           <a href=\"https://www.e-capital.com.hk/cn/report/HKpaper_page.aspx?NID=D87ADE7F-1D29-4B30-AD09-8DE1B2E907ED\" >\n                           <img src=\"http://www.e-capital.com.hk/support/newspaper/{D87ADE7F-1D29-4B30-AD09-8DE1B2E907ED}/20160617%20-%20%e7%b6%93%e6%bf%9f%e6%97%a5%e5%a0%b1.jpg\" hspace=\"0\"></a>\n                                    </td>\n            </tr>\n            </table>\n            </td>\n            <td>&nbsp;</td>\n            <td><p>联储局6月议息会声明，引导市场普遍重燃对环球经济前景关注，加上英国下周四脱欧公投，港股短线反覆偏淡。<a href=\"https://www.e-capital.com.hk/cn/report/HKpaper_page.aspx?NID=D87ADE7F-1D29-4B30-AD09-8DE1B2E907ED\">more>></a></p></td>\n            </tr>\n\n            <tr>\n            <td colspan=\"3\" ></td>\n            </tr>\n\n            </table>\n\n            <table>\n            <tr>\n            <td colspan=\"3\"><p><img src=\"https://www.e-capital.com.hk/cn/images/icon_0011.gif\" hspace=\"5\">\n            <a href=\"https://www.e-capital.com.hk/cn/report/HKpaper_page.aspx?NID=669F2F31-F648-4792-A3D3-D8B63DF9FD1A\" >文汇报&nbsp;&nbsp;5月货币数据对A股正面</a>&nbsp;(2016-06-16)\n\n            </p>            </td>\n            </tr>\n            <tr>\n            <td>\n            <table>\n            <tr>\n            <td>\n\n                           <a href=\"https://www.e-capital.com.hk/cn/report/HKpaper_page.aspx?NID=669F2F31-F648-4792-A3D3-D8B63DF9FD1A\" >\n                           <img src=\"http://www.e-capital.com.hk/support/newspaper/{669F2F31-F648-4792-A3D3-D8B63DF9FD1A}/20160616%20-%20Wen%20Wei%20Po.jpg\" hspace=\"0\"></a>\n                                    </td>\n            </tr>\n            </table>\n            </td>\n            <td>&nbsp;</td>\n            <td><p>MSCI周三发布Ａ股是否被纳进旗下新兴市场指数的结果，尽管是次A股再次未能&#65339;入摩&#65341;，但消息未有对A股产生任何不利影响。一方面，市场近日已对这项结果有所影响(本周一Ａ股大幅回落)，另一方面，市场转而把注意力集中至&#65339;深港股&#65341;政策会否於短期内出台，&#65339;深港通&#65341;憧憬再度发酵成为激励A股昨天表现的主要利多因素。<a href=\"https://www.e-capital.com.hk/cn/report/HKpaper_page.aspx?NID=669F2F31-F648-4792-A3D3-D8B63DF9FD1A\">more>></a></p></td>\n            </tr>\n\n            <tr>\n            <td colspan=\"3\" ></td>\n            </tr>\n\n            </table>\n\n            <table>\n            <tr>\n            <td colspan=\"3\"><p><img src=\"https://www.e-capital.com.hk/cn/images/icon_0011.gif\" hspace=\"5\">\n            <a href=\"https://www.e-capital.com.hk/cn/report/HKpaper_page.aspx?NID=BE7813E1-EC19-4B1F-A8AF-E432F9B88176\" >经济日报&nbsp;&nbsp;领展房产基金 (823.HK)及价值黄金ETF(3081)</a>&nbsp;(2016-06-15)\n\n            </p>            </td>\n            </tr>\n            <tr>\n            <td>\n            <table>\n            <tr>\n            <td>\n\n                           <a href=\"https://www.e-capital.com.hk/cn/report/HKpaper_page.aspx?NID=BE7813E1-EC19-4B1F-A8AF-E432F9B88176\" >\n                           <img src=\"http://www.e-capital.com.hk/support/newspaper/{BE7813E1-EC19-4B1F-A8AF-E432F9B88176}/20160615%20-%20%e7%b6%93%e6%bf%9f%e6%97%a5%e5%a0%b1.jpg\" hspace=\"0\"></a>\n                                    </td>\n            </tr>\n            </table>\n            </td>\n            <td>&nbsp;</td>\n            <td><p>市场注意力集中於本6月23日英国脱欧公投结果，预料在此之前市场避险情绪将有增无减，恒指短线反覆偏弱。<a href=\"https://www.e-capital.com.hk/cn/report/HKpaper_page.aspx?NID=BE7813E1-EC19-4B1F-A8AF-E432F9B88176\">more>></a></p></td>\n            </tr>\n\n            <tr>\n            <td colspan=\"3\" ></td>\n            </tr>\n\n            </table>\n\n            <table>\n            <tr>\n            <td colspan=\"3\"><p><img src=\"https://www.e-capital.com.hk/cn/images/icon_0011.gif\" hspace=\"5\">\n            <a href=\"https://www.e-capital.com.hk/cn/report/HKpaper_page.aspx?NID=44BBC266-AFB3-425E-892A-5F6A51CB5CC7\" >文汇报&nbsp;&nbsp;A股是否入摩影响不大</a>&nbsp;(2016-06-15)\n\n            </p>            </td>\n            </tr>\n            <tr>\n            <td>\n            <table>\n            <tr>\n            <td>\n\n                           <a href=\"https://www.e-capital.com.hk/cn/report/HKpaper_page.aspx?NID=44BBC266-AFB3-425E-892A-5F6A51CB5CC7\" >\n                           <img src=\"http://www.e-capital.com.hk/support/newspaper/{44BBC266-AFB3-425E-892A-5F6A51CB5CC7}/20160615%20-%20Wen%20Wei%20Po.jpg\" hspace=\"0\"></a>\n                                    </td>\n            </tr>\n            </table>\n            </td>\n            <td>&nbsp;</td>\n            <td><p>本文出刊之时，相信A股是否纳进MSCI的结果将揭盎，不过，市场主流看法为：无论A股是次能否成功[入摩]，对A股市场的影响将会属短暂性或程度有限。尽管市场近期对Ａ股&#65339;入摩&#65341;将激励市场的憧憬已明显降温，但沪深股市於结果发布前夕回稳，证券及银行股类支撑大盘回升，较可惜的是，大盘整体上升动能不足。<a href=\"https://www.e-capital.com.hk/cn/report/HKpaper_page.aspx?NID=44BBC266-AFB3-425E-892A-5F6A51CB5CC7\">more>></a></p></td>\n            </tr>\n\n            <tr>\n            <td colspan=\"3\" ></td>\n            </tr>\n\n            </table>\n<br>\n            <div>\n            <span class='navFx'>第一页</span> | <span class='navPx'>上一页</span> | <span class='navMain'>目前为第 1/422 页</span> | <a href='/cn/report/HKpaper.aspx?navNextPage=2' class='navN'>下一页</a> | <a href='/cn/report/HKpaper.aspx?navNextPage=422' class='navL'>最後一页</a>\n			</div>"},
      "en": {title:"群益觀點", body:"<br />\n<table background=\"/images/img004.gif\">\n <form method=\"POST\" action=\"HKpaper.aspx\" name=\"searchForm\" >\n  <tr>\n    <td><img src=\"https://www.e-capital.com.hk/images/icon003.png\" hspace=\"15\" />&nbsp;&nbsp;新聞檢索</td>\n    <td><label>\n      <input type=\"text\" name=\"xkeyword\" />\n      </label>\n    </td>\n    <td>&nbsp;</td>\n    <td><input type=\"image\" name=\"submit\" src=\"https://www.e-capital.com.hk/images/btn_002.gif\" />\n    </td>\n    <td>&nbsp;</td>\n  </tr>\n  </form>\n</table>\n\n            <table>\n            <tr>\n            <td colspan=\"3\"><p><img src=\"https://www.e-capital.com.hk/images/icon_0011.gif\" hspace=\"5\">\n            <a href=\"https://www.e-capital.com.hk/en/report/HKpaper_page.aspx?NID=9FCF6F8F-5AB9-4FDB-A920-665A53F24693\" >香港商報&nbsp;&nbsp;恒指反覆下測19600點</a>&nbsp;(2016-06-17)\n\n            </p>            </td>\n            </tr>\n            <tr>\n            <td>\n            <table>\n            <tr>\n            <td>\n\n                           <a href=\"https://www.e-capital.com.hk/report/HKpaper_page.aspx?NID=9FCF6F8F-5AB9-4FDB-A920-665A53F24693\" >\n                           <img src=\"http://www.e-capital.com.hk/support/newspaper/{9FCF6F8F-5AB9-4FDB-A920-665A53F24693}/20160617%20-%20%e9%a6%99%e6%b8%af%e5%95%86%e5%a0%b1.jpg\" hspace=\"0\"></a>\n                                    </td>\n            </tr>\n            </table>\n            </td>\n            <td>&nbsp;</td>\n            <td><p>當下國際金融市場聚焦的三大事件-A股能否納進MSCI、聯儲局6月議息聲明內容、以及英國的脫歐公投結果，自本周三起陸續揭盎，A股最終未能[入摩]並未完全令市場感意外，而聯儲局理事於加息態度轉趨保守，亦大致屬於市場預期之內，目前最令市場感困擾或感最不明朗的，便是本月23日（下週四）的英國脫歐公投結果，故在公投之前，預計市場普遍將充斥審慎情緒，恆生指數短線面臨反覆下測19600點壓力。<a href=\"https://www.e-capital.com.hk/en/report/HKpaper_page.aspx?NID=9FCF6F8F-5AB9-4FDB-A920-665A53F24693\">more>></a></p></td>\n            </tr>\n\n            <tr>\n            <td colspan=\"3\" >            </td>\n            </tr>\n\n            </table>\n\n            <table>\n            <tr>\n            <td colspan=\"3\"><p><img src=\"https://www.e-capital.com.hk/images/icon_0011.gif\" hspace=\"5\">\n            <a href=\"https://www.e-capital.com.hk/en/report/HKpaper_page.aspx?NID=D87ADE7F-1D29-4B30-AD09-8DE1B2E907ED\" >經濟日報&nbsp;&nbsp;置富產業信託 (778.HK)及香港電訊-SS (6823)</a>&nbsp;(2016-06-17)\n\n            </p>            </td>\n            </tr>\n            <tr>\n            <td>\n            <table>\n            <tr>\n            <td>\n\n                           <a href=\"https://www.e-capital.com.hk/report/HKpaper_page.aspx?NID=D87ADE7F-1D29-4B30-AD09-8DE1B2E907ED\" >\n                           <img src=\"http://www.e-capital.com.hk/support/newspaper/{D87ADE7F-1D29-4B30-AD09-8DE1B2E907ED}/20160617%20-%20%e7%b6%93%e6%bf%9f%e6%97%a5%e5%a0%b1.jpg\" hspace=\"0\"></a>\n                                    </td>\n            </tr>\n            </table>\n            </td>\n            <td>&nbsp;</td>\n            <td><p>聯儲局6月議息會聲明，引導市場普遍重燃對環球經濟前景關注，加上英國下週四脫歐公投，港股短線反覆偏淡。<a href=\"https://www.e-capital.com.hk/en/report/HKpaper_page.aspx?NID=D87ADE7F-1D29-4B30-AD09-8DE1B2E907ED\">more>></a></p></td>\n            </tr>\n\n            <tr>\n            <td colspan=\"3\" >            </td>\n            </tr>\n\n            </table>\n\n            <table>\n            <tr>\n            <td colspan=\"3\"><p><img src=\"https://www.e-capital.com.hk/images/icon_0011.gif\" hspace=\"5\">\n            <a href=\"https://www.e-capital.com.hk/en/report/HKpaper_page.aspx?NID=669F2F31-F648-4792-A3D3-D8B63DF9FD1A\" >文匯報&nbsp;&nbsp;5月貨幣數據對A股正面</a>&nbsp;(2016-06-16)\n\n            </p>            </td>\n            </tr>\n            <tr>\n            <td>\n            <table>\n            <tr>\n            <td>\n\n                           <a href=\"https://www.e-capital.com.hk/report/HKpaper_page.aspx?NID=669F2F31-F648-4792-A3D3-D8B63DF9FD1A\" >\n                           <img src=\"http://www.e-capital.com.hk/support/newspaper/{669F2F31-F648-4792-A3D3-D8B63DF9FD1A}/20160616%20-%20Wen%20Wei%20Po.jpg\" hspace=\"0\"></a>\n                                    </td>\n            </tr>\n            </table>\n            </td>\n            <td>&nbsp;</td>\n            <td><p>MSCI週三發佈Ａ股是否被納進旗下新興市場指數的結果，儘管是次A股再次未能&#65339;入摩&#65341;，但消息未有對A股產生任何不利影響。一方面，市場近日已對這項結果有所影響(本週一Ａ股大幅回落)，另一方面，市場轉而把注意力集中至&#65339;深港股&#65341;政策會否於短期內出台，&#65339;深港通&#65341;憧憬再度發酵成為激勵A股昨天表現的主要利多因素。<a href=\"https://www.e-capital.com.hk/en/report/HKpaper_page.aspx?NID=669F2F31-F648-4792-A3D3-D8B63DF9FD1A\">more>></a></p></td>\n            </tr>\n\n            <tr>\n            <td colspan=\"3\" >            </td>\n            </tr>\n\n            </table>\n\n            <table>\n            <tr>\n            <td colspan=\"3\"><p><img src=\"https://www.e-capital.com.hk/images/icon_0011.gif\" hspace=\"5\">\n            <a href=\"https://www.e-capital.com.hk/en/report/HKpaper_page.aspx?NID=BE7813E1-EC19-4B1F-A8AF-E432F9B88176\" >經濟日報&nbsp;&nbsp;領展房產基金 (823.HK)及價值黃金ETF(3081)</a>&nbsp;(2016-06-15)\n\n            </p>            </td>\n            </tr>\n            <tr>\n            <td>\n            <table>\n            <tr>\n            <td>\n\n                           <a href=\"https://www.e-capital.com.hk/report/HKpaper_page.aspx?NID=BE7813E1-EC19-4B1F-A8AF-E432F9B88176\" >\n                           <img src=\"http://www.e-capital.com.hk/support/newspaper/{BE7813E1-EC19-4B1F-A8AF-E432F9B88176}/20160615%20-%20%e7%b6%93%e6%bf%9f%e6%97%a5%e5%a0%b1.jpg\" hspace=\"0\"></a>\n                                    </td>\n            </tr>\n            </table>\n            </td>\n            <td>&nbsp;</td>\n            <td><p>市場注意力集中於本6月23日英國脫歐公投結果，預料在此之前市場避險情緒將有增無減，恆指短線反覆偏弱。<a href=\"https://www.e-capital.com.hk/en/report/HKpaper_page.aspx?NID=BE7813E1-EC19-4B1F-A8AF-E432F9B88176\">more>></a></p></td>\n            </tr>\n\n            <tr>\n            <td colspan=\"3\" >            </td>\n            </tr>\n\n            </table>\n\n            <table>\n            <tr>\n            <td colspan=\"3\"><p><img src=\"https://www.e-capital.com.hk/images/icon_0011.gif\" hspace=\"5\">\n            <a href=\"https://www.e-capital.com.hk/en/report/HKpaper_page.aspx?NID=44BBC266-AFB3-425E-892A-5F6A51CB5CC7\" >文匯報&nbsp;&nbsp;A股是否入摩影響不大</a>&nbsp;(2016-06-15)\n\n            </p>            </td>\n            </tr>\n            <tr>\n            <td>\n            <table>\n            <tr>\n            <td>\n\n                           <a href=\"https://www.e-capital.com.hk/report/HKpaper_page.aspx?NID=44BBC266-AFB3-425E-892A-5F6A51CB5CC7\" >\n                           <img src=\"http://www.e-capital.com.hk/support/newspaper/{44BBC266-AFB3-425E-892A-5F6A51CB5CC7}/20160615%20-%20Wen%20Wei%20Po.jpg\" hspace=\"0\"></a>\n                                    </td>\n            </tr>\n            </table>\n            </td>\n            <td>&nbsp;</td>\n            <td><p>本文出刊之時，相信A股是否納進MSCI的結果將揭盎，不過，市場主流看法為：無論A股是次能否成功[入摩]，對A股市場的影響將會屬短暫性或程度有限。儘管市場近期對Ａ股&#65339;入摩&#65341;將激勵市場的憧憬已明顯降溫，但滬深股市於結果發佈前夕回穩，證券及銀行股類支撐大盤回升，較可惜的是，大盤整體上升動能不足。<a href=\"https://www.e-capital.com.hk/en/report/HKpaper_page.aspx?NID=44BBC266-AFB3-425E-892A-5F6A51CB5CC7\">more>></a></p></td>\n            </tr>\n\n            <tr>\n            <td colspan=\"3\" >            </td>\n            </tr>\n\n            </table>\n<br>\n            <div>\n            <span class='navFx'>第一頁</span> | <span class='navPx'>上一頁</span> | <span class='navMain'>目前為第 1/422 頁</span> | <a href='/en/report/HKpaper.aspx?navNextPage=2' class='navN'>下一頁</a> | <a href='/en/report/HKpaper.aspx?navNextPage=422' class='navL'>最後一頁</a>\n			</div>"}
    },

      "zh-Hant": {title:"風險披露聲明", body:"<div>\n	<div>證券交易的風險</div>\n	證券價格有時可能會非常波動。證券價格可升可跌，甚至變成亳無價值。買賣證券未必一定能夠賺取利潤，反而可能會招致損失。<br />\n	<br />\n	<div>期貨及期權交易的風險</div>\n買賣期貨合約或期權的虧蝕風險可以極大。在若干情況下，你所蒙受的虧蝕可能會超過最初存入的保證金數額。即使你設定了備用指示，例如「止蝕」或「限價」等指示，亦未必能夠避免損失。市場情況可能使該等指示無法執行。你可能會在短時間內被要求存入額外的保證金。假如未能在指定的時間內提供所需數額，你的未平倉合約可能會被平倉。然而，你仍然要對你的帳戶內任何因此而出現的短欠數額負責。因此，你在買賣前應研究及理解期貨合約及期權，以及根據本身的財政狀況及投資目標，仔細考慮這種買賣是否適合你。如果你買賣期權，便應熟悉行使期權及期權到期時的程序，以及你在行使期權及期權到期時的權利與責任。<br /><br />\n<div>滬港通交易的風險</div>\n詳細說明請<a href=\"https://www.e-capital.com.hk/pdf/Risks_Disclosure_of_Investing_in_Shanghai–HongKong_Stock_Connect_Northbound_Securities.pdf\">按此下載</a><br /><br /> </div>"},
      "zh-Hans": null,
      "en": {title:"Risk Disclosure Statement", body:"<div>\n<div><strong> Risk of Securities Trading</strong></div>\nThe prices of securities fluctuate, sometimes dramatically. The price of a security may move up or down, and may become valueless. It is as likely that losses will be incurred rather than profit made as a result of buying and selling securities.<br /></br>\n<div><strong> Risk of Trading Futures and Options</strong></div>\nThe risk of loss in trading futures contracts or options is substantial. In some circumstances, you may sustain losses in excess of your initial margin funds. Placing contingent orders, such as \"stop-loss\" or \"stop-limit\" orders, will not necessarily avoid loss. Market conditions may make it impossible to execute such orders. You may be called upon at short notice to deposit additional margin funds. If the required funds are not provided within the prescribed time, your position may be liquidated. You will remain liable for any resulting deficit in your account. You should therefore study and understand futures contracts and options before you trade and carefully consider whether such trading is suitable in the light of your own financial position and investment objectives. If you trade options you should inform yourself of exercise and expiration procedures and your rights and obligations upon exercise or expiry.</br></br>\n<div>Risk of Shanghai – Hong Kong Stock Connect Trading</div>\nMore information <a href=\"https://www.e-capital.com.hk/../../ETtrade/pdf/Risks_Disclosure_of_Investing_in_Shanghai–HongKong_Stock_Connect_Northbound_Securities.pdf\">click download!</a><br /><br /> </div>"}

      "zh-Hant": {title:"滬港通通識", body:"<div>\n\n<div>\n	<div>\n        <span><strong>1.哪些產品可透過滬股通進行交易？</strong></span>\n        <div>在各類滬股中，初始階段僅有A股獲納入滬港通。其他產品類別如B股、交易所買賣基金、債券以及其他證券將不包括在內。 <br /><br />在初始階段，香港與海外投資者可買賣上交所市場上市的若干股票（滬股通股票），包括證180指數的成份股、上證380指數的成份股，以及不在上述指數成份股內但有H股同時在聯交所上市及買賣的上交所上市A股，但不包括下列股票： <br />(a) 所有以人民幣以外貨幣報價的滬股；及<br />(b) 所有被實施風險警示的滬股。\n        </div>\n	</div><br />\n\n  <div>\n  <span><strong>2.滬港通是否設有額度？</strong></span>\n    <div>是。通過滬港交易通達成的交易初期將受制於一個跨境投資總額度（即總額度）以及一個每日額度。<br /><br />北向交易及南向交易分別受制於不同的總額度及每日額度，由聯交所及上交所分別監控。北向總額度為人民幣3,000億元。南向總額度為人民幣2,500億元。北向每日額度為人民幣130億元，南向每日額度為人民幣105億元。<br /><br />總額度及每日額度按「淨買盤」的基礎計算。根據此原則，不計額度結餘多少，投資者均可隨時出售跨境證券。\n	</div>\n  </div><br />\n\n  <div>\n  	<span><strong>3.總額度如何操作?</strong></span>\n    <div>滬股通總額度為人民幣3,000億元。港股通總額度為人民幣2,500億元。於每個交易日完結時，聯交所將按下列方式計算及發布滬股通總額度餘額：<br /><br />\n總額度餘額 ＝ 總額度 － 買盤成交總額 ＋ 賣盤成交總額（按【加權平均費用】計算）<br />\n賣盤成交總額的加權平均費用乃按各滬股通股票透過滬股交易通進行的所有買盤成交購買費用計算，而非各個別交易所參與者實際進行的相應買盤成交。如總額度餘額少於每日額度，北向買盤將於下一交易日暫停。但投資者仍可繼續出售滬股通股票，令總額度餘額增加。一旦總額度餘額回到每日額度水平或以上，聯交所就恢復北向買盤服務。\n    </div>\n  </div><br />\n\n  <div>\n  	<span><strong>4.每日額度如何操作? </strong></span>\n    <div>每日額度限制滬港通下每日跨境交易的最高買盤淨額。聯交所實時監察北向每日額度的用量，而北向每日額度餘額將每隔1分鐘在香港交易所網站上更新。<br /><br />每日額度餘額 = 每日額度 － 買盤訂單 ＋ 賣盤成交金額 ＋ 微調<br /><br />視乎總額度餘額，每日額度每日更新及維持相同。未使用的每日額度不會結轉至下一日的每日額度。一旦北向每日額度餘額於連續競價時段（連續交易）降至零或交易已超過餘額，日內餘下時間將不再接受買盤訂單。<br /><br />視乎總額度餘額，聯交所將於下一交易日恢復北向買盤服務。一旦北向每日額度餘額於開市集合競價時段降至零或交易已超過餘額，新的買盤將被駁回。不過，由於取消訂單在開市集合競價時段很普遍，北向每日額度餘額或可於競價時段完結前已快速回復正數水平。屆時，聯交所將再次接受北向買盤訂單。\n	</div>\n  </div><br />\n\n  <div>\n	<span><strong>5.是否設有任何防範惡意搶占額度的措施？</strong></span>\n	<div>自滬港通宣布以來，聯交所一直收到市場對滬股通額度可能被濫用以至影響試點計劃正常運作的關注。有見及此，聯交所將會設立買盤訂單的動態價格檢查。買盤輸入價比當前最佳競價（如無當前最佳競價，則為最新成交價；如無當前最佳競價及最新成交價，則為前收市價）低於指定百分比的買盤訂單將被CSC拒絕受理。在開市集合競價期間，當前競價將被用作價格檢查（如無當前競價，則為前收市價）。動態價格檢查將於整個交易日內全面應用，即由開市集合競價開始前的五分鐘輸入時段直至午市連續競價結束為止。聯交所擬於滬港通運行初期將動態價格檢查訂為3%。此百分比可按市況不時調整。\n	</div>\n  </div><br />\n\n  <div>\n  <span><strong>6.滬港通與目前的合格境內機構投資者(QDII)／合格境外機構投資者(QFII)計劃有何區別？</strong></span>\n    <div>滬港通與現存的QDII、QFII及人民幣合格境外機構投資者(RQFII)等計劃的分別如下：<br />\n    	<ol>\n        	<li>在合資格投資者方面，滬港通開放予上交所會員以及內地的、機構投資者及符合若干資格條件的個人投資者進行南向交易，以及香港交易所的交易所參與者及其任何客戶（並無限制）進行北向交易；相對而言，QDII及QFII計劃的對象為指定的機構投資者，並且其對象不限於香港地區的投資者；</li>\n            <li>可作投資的合資格產品方面，滬港通接納若干上交所上市A股及港股，而QDII、QFII及RQFII計劃允許的投資範圍不同；在額度方面，滬港通設有應用於整體市場的額度而無需分配予個別投資者；而QDII、QFII及RQFII計劃設立的額度則分配予合格機構投資者;</li>\n        </ol>\n	</div>\n  </div><br />\n\n  <div>\n  <span><strong>7.我們是否受投資者賠償基金保障?</strong></span>\n    <div>透過聯交所參與者參與滬港通的香港投資者將繼續受到香港法例保障。同樣，交易及結算活動方面，香港投資者將繼續與聯交所參與者協調，並受到《證券及期貨條例》保障。然而，值得注意的是，現有的投資者賠償基金並不涵蓋任何北向交易。</div>\n  </div><br />\n\n  <div>\n  	<span><strong>8.投資者可否對滬股通股票進行回轉交易？</strong></span>\n    <div>內地A股市場不允許回轉交易。因此，香港與海外投資者於T日買入滬股通股票後僅可於T+1日或之後賣出。</div>\n  </div>\n  <br />\n\n  <div>\n  <span><strong>9.滬股通股票可否進行孖展買賣？</strong></span>\n    <div>在符合監管機構的相關條件下，滬股通股票可進行孖展買賣。</div>\n  </div><br />\n\n  <div>\n  	<span><strong>10.滬股通股票可否進行股票借貸？</strong></span>\n    <div>滬股通股票的股票借貸可在以下情況進行：<br />\n    	<ol>\n        	<li>有擔保的賣空交易</li>\n            <li>在特定情況下以符合交易前端監控規定</li>\n        </ol>\n	</div>\n  </div>\n  <br />\n\n  <div>\n  	<span><strong>11.股通股票可否進行場外轉移？</strong></span>\n    <div>中國證監會有關滬港通的若干規定第十一條訂明，滬股通股票的轉移只可在上交所進行，除非另獲批准，否則不可進行場外交易。</div>\n  </div>\n  <br />\n\n  <div>\n  	<span><strong>12.上交所的價格限制是否適用於滬股通？</strong></span>\n    <div>就滬股通股票而言，上交所目前實行的價格限制一般為不超過前一日收市價的 ±10%（被納入風險警示板的滬股（即ST股票及*ST股票）的價格限制為±5%）。所有滬股通股票訂單的價格必須在價格限制範圍之內，否則訂單會被上交所拒絕。價格限制的上下限在一天之內不會變動。</div>\n  </div>\n  <br />\n\n  <div>\n  	<span><strong>13.甚麼是交易前檢查的規定？</strong></span>\n    <div>目前，內地投資者只可出售前一天日終時其股份戶口持有的A股。根據投資者的持股量，若投資者戶口並無足夠股份，上交所將拒絕相關賣盤訂單。<br /><br />投資者必須確保其於交易所參與者（作為賣盤經紀）開立的戶口有足夠股份。若股份存於另一交易所參與者或託管人的戶口，投資者必須先於T-1日將股份轉移至相關賣盤交易所參與者，以便於T日出售股份。 </div>\n  </div>\n  <br />\n\n  <div>\n  	<span><strong>14.假期安排如何？</strong></span>\n    <div>在滬港通推出初期，投資者只可於兩地市場均開放交易且兩地市場的銀行於相應的交收日均開放服務的工作日在對方市場進行交易。此安排將確保兩地市場投資者及經紀可在相關結算日通過銀行收發相關款項。</div>\n  </div>\n  <br />\n\n  <div>\n  	<span><strong>15.投資者可否經現有的香港經紀進行買賣？是否需要與任何機構開立額外戶口以經滬港通買賣滬股通股票？</strong></span>\n    <div>香港與海外投資者可選擇任何聯交所參與者買賣滬股通股票，惟所選的聯交所參與者須符合資格參與滬港通。</div>\n  </div>\n  <br />\n\n  <div>\n  	<span><strong>16.香港與海外投資者經滬港通購入的滬股通股票將如何託管？投資者可否通過滬港通在香港持有實物滬股通股票？</strong></span>\n    <div>由於滬股通股票均以無紙化形式發行，中央結算系統證券存管處將不設滬股通股票的實物股票記存及提取服務。</div>\n  </div>\n  <br />\n\n  <div>\n  	<span><strong>17.投資者如何參與滬股通股票的企業行為？</strong></span>\n    <div>香港結算將為其中央結算系統參與者/投資者在中央結算系統中持有的滬股通股票在可行及適用的情況下提供代理人服務。<br /><br />香港結算將通知中央結算系統參與者所有滬股通股票股東大會詳情，例如大會舉行日期、時間及決議案數目等。香港及海外投資者於記錄日期在中央結算系統參與者持有相關股份可透過中央結算系統參與者進行投票。香港結算會整合中央結算系統參與者的投票指示，盡力透過指定網絡投票平台遞交一份綜合投票結果（包含贊成及/或反對的股數和棄權及/或累積投票（如適用）的股數）予相關的滬股通股票發行人。\n</div>\n  </div>\n  <br />\n\n  <div>\n  	<span><strong>18.經滬港通買賣及交收滬股通股票的稅費如何？</strong></span>\n    <div>香港與海外投資者透過滬港通買賣滬股通股票將須繳納上交所現行的交易相關費用（即：經手費、證管費）以及中國結算現行的結算相關費用 (即過戶費)。</div>\n  </div>\n  <br />\n    <div>\n        <span><strong>19.我希望進一步了解滬港通，怎樣聯絡你們？</strong></span>\n        <div>如果你是舊客戶，請聯絡您的個人客戶經紀，新客戶可致電我們的客戶服務主任。下表是其它專線電話，你亦可在本網站”<a href=\"http://www.e-capital.com.hk/aboutus/contact.aspx\">聯絡我們</a>”頁內留下聯絡資料，我們會有專責人員聯絡閣下。<br /><br />\n        <table>\n        	<tr>\n            	<th>台灣免費專線電話</th>\n                <td>00801-856293</td>\n                <td>00801-856262</td>\n            </tr>\n        	<tr>\n            	<th>香港交易專線</th>\n                <td>(852)2105-1205 </td>\n                <td>(852)2105-1215</td>\n            </tr>\n        	<tr>\n            	<th>香港客戶服務</th>\n                <td>(852)2105-1219</td>\n                <td>(852)2105-1255</td>\n            </tr>\n        	<tr>\n            	<th>香港研究部</th>\n                <td>(852)2105-1101</td>\n                <td>&nbsp;</td>\n            </tr>\n        	<tr>\n            	<th>香港總機</th>\n                <td>(852)2530-9966 </td>\n                <td>&nbsp;</td>\n            </tr>\n        </table>\n        </div>\n      </div>\n      <br />\n<blockquote>資料來源:香港交易所</blockquote>\n</div>\n<br />\n\n</div>"},
      "zh-Hans": {title:"沪港通通识", body:"<div>\n\n<div>\n	<div>\n        <span><strong>1.哪些产品可透过沪股通进行交易？</strong></span>\n        <div>在各类沪股中，初始阶段仅有A股获纳入沪港通。其他产品类别如B股、交易所买卖基金、债券以及其他证券将不包括在内。 <br /><br />在初始阶段，香港与海外投资者可买卖上交所市场上市的若干股票（沪股通股票），包括证180指数的成份股、上证380指数的成份股，以及不在上述指数成份股内但有H股同时在联交所上市及买卖的上交所上市A股，但不包括下列股票： <br />(a) 所有以人民币以外货币报价的沪股；及<br />(b) 所有被实施风险警示的沪股。\n        </div>\n	</div><br />\n\n  <div>\n  <span><strong>2.沪港通是否设有额度？</strong></span>\n    <div>是。通过沪港交易通达成的交易初期将受制於一个跨境投资总额度（即总额度）以及一个每日额度。<br /><br />北向交易及南向交易分别受制於不同的总额度及每日额度，由联交所及上交所分别监控。北向总额度为人民币3,000亿元。南向总额度为人民币2,500亿元。北向每日额度为人民币130亿元，南向每日额度为人民币105亿元。<br /><br />总额度及每日额度按「净买盘」的基础计算。根据此原则，不计额度结余多少，投资者均可随时出售跨境证券。\n	</div>\n  </div><br />\n\n  <div>\n  	<span><strong>3.总额度如何操作?</strong></span>\n    <div>沪股通总额度为人民币3,000亿元。港股通总额度为人民币2,500亿元。於每个交易日完结时，联交所将按下列方式计算及发布沪股通总额度余额：<br /><br />\n总额度余额 ＝ 总额度 － 买盘成交总额 ＋ 卖盘成交总额（按【加权平均费用】计算）<br />\n卖盘成交总额的加权平均费用乃按各沪股通股票透过沪股交易通进行的所有买盘成交购买费用计算，而非各个别交易所参与者实际进行的相应买盘成交。如总额度余额少於每日额度，北向买盘将於下一交易日暂停。但投资者仍可继续出售沪股通股票，令总额度余额增加。一旦总额度余额回到每日额度水平或以上，联交所就恢复北向买盘服务。\n\n    </div>\n  </div><br />\n\n  <div>\n  	<span><strong>4.每日额度如何操作? </strong></span>\n    <div>每日额度限制沪港通下每日跨境交易的最高买盘净额。联交所实时监察北向每日额度的用量，而北向每日额度余额将每隔1分钟在香港交易所网站上更新。<br /><br />每日额度余额 = 每日额度 － 买盘订单 ＋ 卖盘成交金额 ＋ 微调<br /><br />视乎总额度余额，每日额度每日更新及维持相同。未使用的每日额度不会结转至下一日的每日额度。一旦北向每日额度余额於连续竞价时段（连续交易）降至零或交易已超过余额，日内余下时间将不再接受买盘订单。<br /><br />视乎总额度余额，联交所将於下一交易日恢复北向买盘服务。一旦北向每日额度余额於开市集合竞价时段降至零或交易已超过余额，新的买盘将被驳回。不过，由於取消订单在开市集合竞价时段很普遍，北向每日额度余额或可於竞价时段完结前已快速回复正数水平。届时，联交所将再次接受北向买盘订单。\n	</div>\n  </div><br />\n\n  <div>\n	<span><strong>5.是否设有任何防范恶意抢占额度的措施？</strong></span>\n	<div>自沪港通宣布以来，联交所一直收到市场对沪股通额度可能被滥用以至影响试点计划正常运作的关注。有见及此，联交所将会设立买盘订单的动态价格检查。买盘输入价比当前最佳竞价（如无当前最佳竞价，则为最新成交价；如无当前最佳竞价及最新成交价，则为前收市价）低於指定百分比的买盘订单将被CSC拒绝受理。在开市集合竞价期间，当前竞价将被用作价格检查（如无当前竞价，则为前收市价）。动态价格检查将於整个交易日内全面应用，即由开市集合竞价开始前的五分钟输入时段直至午市连续竞价结束为止。联交所拟於沪港通运行初期将动态价格检查订为3%。此百分比可按市况不时调整。\n	</div>\n  </div><br />\n\n  <div>\n  <span><strong>6.沪港通与目前的合格境内机构投资者(QDII)／合格境外机构投资者(QFII)计划有何区别？</strong></span>\n    <div>沪港通与现存的QDII、QFII及人民币合格境外机构投资者(RQFII)等计划的分别如下：<br />\n    	<ol>\n        	<li>在合资格投资者方面，沪港通开放予上交所会员以及内地的、机构投资者及符合若干资格条件的个人投资者进行南向交易，以及香港交易所的交易所参与者及其任何客户（并无限制）进行北向交易；相对而言，QDII及QFII计划的对象为指定的机构投资者，并且其对象不限於香港地区的投资者；</li>\n            <li>可作投资的合资格产品方面，沪港通接纳若干上交所上市A股及港股，而QDII、QFII及RQFII计划允许的投资范围不同；在额度方面，沪港通设有应用於整体市场的额度而无需分配予个别投资者；而QDII、QFII及RQFII计划设立的额度则分配予合格机构投资者;</li>\n        </ol>\n	</div>\n  </div><br />\n\n  <div>\n  <span><strong>7.我们是否受投资者赔偿基金保障?</strong></span>\n    <div>透过联交所参与者参与沪港通的香港投资者将继续受到香港法例保障。同样，交易及结算活动方面，香港投资者将继续与联交所参与者协调，并受到《证券及期货条例》保障。然而，值得注意的是，现有的投资者赔偿基金并不涵盖任何北向交易。</div>\n  </div><br />\n\n  <div>\n  	<span><strong>8.投资者可否对沪股通股票进行回转交易？</strong></span>\n    <div>内地A股市场不允许回转交易。因此，香港与海外投资者於T日买入沪股通股票後仅可於T+1日或之後卖出。</div>\n  </div>\n  <br />\n\n  <div>\n  <span><strong>9.沪股通股票可否进行孖展买卖？</strong></span>\n    <div>在符合监管机构的相关条件下，沪股通股票可进行孖展买卖。</div>\n  </div><br />\n\n  <div>\n  	<span><strong>10.沪股通股票可否进行股票借贷？</strong></span>\n    <div>沪股通股票的股票借贷可在以下情况进行：<br />\n    	<ol>\n\n        	<li>有担保的卖空交易</li>\n            <li>在特定情况下以符合交易前端监控规定</li>\n        </ol>\n	</div>\n  </div>\n  <br />\n\n  <div>\n  	<span><strong>11.股通股票可否进行场外转移？</strong></span>\n    <div>中国证监会有关沪港通的若干规定第十一条订明，沪股通股票的转移只可在上交所进行，除非另获批准，否则不可进行场外交易。</div>\n  </div>\n  <br />\n\n  <div>\n  	<span><strong>12.上交所的价格限制是否适用於沪股通？</strong></span>\n    <div>就沪股通股票而言，上交所目前实行的价格限制一般为不超过前一日收市价的 ±10%（被纳入风险警示板的沪股（即ST股票及*ST股票）的价格限制为±5%）。所有沪股通股票订单的价格必须在价格限制范围之内，否则订单会被上交所拒绝。价格限制的上下限在一天之内不会变动。</div>\n  </div>\n  <br />\n\n  <div>\n  	<span><strong>13.甚麽是交易前检查的规定？</strong></span>\n    <div>目前，内地投资者只可出售前一天日终时其股份户口持有的A股。根据投资者的持股量，若投资者户口并无足够股份，上交所将拒绝相关卖盘订单。<br /><br />投资者必须确保其於交易所参与者（作为卖盘经纪）开立的户口有足够股份。若股份存於另一交易所参与者或托管人的户口，投资者必须先於T-1日将股份转移至相关卖盘交易所参与者，以便於T日出售股份。 </div>\n  </div>\n  <br />\n\n  <div>\n  	<span><strong>14.假期安排如何？</strong></span>\n    <div>在沪港通推出初期，投资者只可於两地市场均开放交易且两地市场的银行於相应的交收日均开放服务的工作日在对方市场进行交易。此安排将确保两地市场投资者及经纪可在相关结算日通过银行收发相关款项。</div>\n  </div>\n  <br />\n\n  <div>\n  	<span><strong>15.投资者可否经现有的香港经纪进行买卖？是否需要与任何机构开立额外户口以经沪港通买卖沪股通股票？</strong></span>\n    <div>香港与海外投资者可选择任何联交所参与者买卖沪股通股票，惟所选的联交所参与者须符合资格参与沪港通。</div>\n  </div>\n  <br />\n\n  <div>\n  	<span><strong>16.香港与海外投资者经沪港通购入的沪股通股票将如何托管？投资者可否通过沪港通在香港持有实物沪股通股票？</strong></span>\n    <div>由於沪股通股票均以无纸化形式发行，中央结算系统证券存管处将不设沪股通股票的实物股票记存及提取服务。</div>\n  </div>\n  <br />\n\n  <div>\n  	<span><strong>17.投资者如何参与沪股通股票的企业行为？</strong></span>\n    <div>香港结算将为其中央结算系统参与者/投资者在中央结算系统中持有的沪股通股票在可行及适用的情况下提供代理人服务。<br /><br />香港结算将通知中央结算系统参与者所有沪股通股票股东大会详情，例如大会举行日期、时间及决议案数目等。香港及海外投资者於记录日期在中央结算系统参与者持有相关股份可透过中央结算系统参与者进行投票。香港结算会整合中央结算系统参与者的投票指示，尽力透过指定网络投票平台递交一份综合投票结果（包含赞成及/或反对的股数和弃权及/或累积投票（如适用）的股数）予相关的沪股通股票发行人。\n</div>\n  </div>\n  <br />\n\n  <div>\n  	<span><strong>18.经沪港通买卖及交收沪股通股票的税费如何？</strong></span>\n    <div>香港与海外投资者透过沪港通买卖沪股通股票将须缴纳上交所现行的交易相关费用（即：经手费、证管费）以及中国结算现行的结算相关费用 (即过户费)。</div>\n  </div>\n  <br />\n<div>\n  	<span><strong>19.我希望进一步了解沪港通，怎样联络你们？</strong></span>\n    <div>如果你是旧客户，请联络您的个人客户经纪，新客户可致电我们的业务部门。下表是其它专线电话，你亦可在本网站\"<a href=\"https://www.e-capital.com.hk/aboutus/contact.aspx\" title=\"联络我们\">联络我们</a>\"页内留下联络资料，我们会有专责人员联络阁下。\n<br /><br />\n        <table>\n        	<tr>\n            	<th>台湾免费专线电话</th>\n                <td>00801-856293</td>\n                <td>00801-856293</td>\n            </tr>\n        	<tr>\n            	<th>香港交易专线</th>\n                <td>(852)2105-1205 </td>\n                <td>(852)2105-1280</td>\n            </tr>\n        	<tr>\n            	<th>香港业务部</th>\n                <td>(852)2105-1219</td>\n                <td>&nbsp;</td>\n            </tr>\n        	<tr>\n            	<th>香港研究部</th>\n                <td>(852)2105-1101</td>\n                <td>&nbsp;</td>\n            </tr>\n        	<tr>\n            	<th>香港总机</th>\n                <td>(852)2530-9966 </td>\n                <td>&nbsp;</td>\n            </tr>\n        </table>\n    </div>\n  </div>\n  <br />\n<blockquote>资料来源:香港交易所</blockquote>\n</div>\n<br />\n\n</div>"},

      "zh-Hant": {title:"開戶程序", body:"<div>\n<div>新客戶</div>\n          <div>新客戶可於本公司網頁下載開立證券帳戶之客戶交易協議及其他所需文件，列印、簽署並寄回正本到本公司：<br />\n        群益證券(香港)有限公司<br />\n        香港德輔道中308號富衛金融中心3樓 ─ 客戶服務主任收<br />\n<br />\n\n          本公司會分配專業之註冊經紀安排與閣下聯絡及辦理餘下之開戶程序。另客戶亦可親身到本公司辦理開戶手續。預約請致電(852) 2530-9966或以<a href=\"https://www.e-capital.com.hk/aboutus/contact.aspx\">電郵</a>與客戶服務主任聯繫。<br />\n</div>\n<hr />\n<div>現有客戶</div>\n<div>\n若閣下已是群益證券(香港)有限公司現有客戶，則可直接聯絡閣下之經紀查詢及辦理有關更改戶口類別的手續。或請致電(852) 2530-9966 或以<a href=\"https://www.e-capital.com.hk/aboutus/contact.aspx\">電郵</a>與客戶服務主任聯繫。<br />\n</div>\n<br />\n</div>"},
      "zh-Hans": {title:"开户程序", body:"<div>\n<div>若阁下不是群益证券(香港)有限公司现有客户，可透过下列方法申请：</div>\n          <div>新客户可於本公司网页下载开立证券帐户之客户交易协议及其他所需文件，列印、签署并寄回正本到本公司：\n          <br />\n            群益证券(香港)有限公司　网上交易部<br />\n            香港皇后大道中183号　　新纪元广场中远大厦32楼3204-07室<br />\n            本公司会分配专业之注册经纪安排与阁下联络及办理余下之开户程序。另客户亦可亲身到本公司办理开户手续。预约请致电(852) 2105-1255或电邮至gary_pong@e-capital.com.hk与营业部联系<br />\n          </div>\n<hr />\n<div>若阁下是群益证券(香港)有限公司现有客户</div>\n<div>\n    若阁下已是群益证券(香港)有限公司现有客户，则可直接联络阁下之经纪查询及办理有关更改户口类别的手续。或致电(852) 2105-1255或电邮至gary_pong@e-capital.com.hk与营业部联系 <br /><br />\n          </div>\n</div>"},
      "en": {title:"Account Opening Procedure", body:"<div>\n          <div>New client can download the Customer Trading Agreement and other account opening documents in relation to the open of securities trading account. Then please print, sign and return to us: <br />\n            <br />\nCSC Securities (HK) Limited<br />\nUnits 3204-7, 32/F., Cosco Tower, Grand Millennium Plaza,<br />\n183 Queen's Road Central, Hong Kong<br />\nAttn.: Sales Department<br />\n<br />\nWe will assign a licensed account executive to contact you and complete the remaining account opening procedures. On the other hand, you may also visit us in person to open an account. Please call (852) 2530-9966 or email to <a href=\"mailto:fund_dl@e-capital.com.hk\" > fund_dl@e-capital.com.hk</a> for reservation <br />\n<br />\nIf you are an existing client of CSC Securities (HK) Limited, please feel free to contact your account executive for more information regarding the change of account type.<br /><br />\n</div>\n</div>\n<br />\n</div>"}

      "zh-Hant": {title:"常見問題", body:"<div>\n<div><strong>落盤買賣</strong></div>\n<div>\n<div>\n    <span><strong>1.怎樣落盤？</strong></span>\n    <div>當登入群益香港下單系統後，於介面最上方的落盤框按落盤的步驟，並輸入所需的資料即可。\n</div>\n    </div><br />\n\n  <div>\n  <span><strong>2.落盤後會有什麼事情發生？ </strong></span>\n    <div>當你輸入落盤後，系統會自動彈出提示視窗，把該盤資料匯總並顯示出來。內容包括下單帳號、証券名稱、証券代號、買賣方向、數量、價格、佣金、其他交易徵費和總金額。確認資料沒錯後，按下提示窗的「確定」按鈕，該盤便會自動送到SEHK。</div></div><br />\n\n  <div>\n  <span><strong>3.我可否取消交易？</strong></span>\n    <div>可以，只要交易尚未執行。但請緊記，因交易進行及取消交易時間的問題，每宗取消交易指示均不保證可以成功執行。若交易已執行，便只可取消餘下尚未執行的交易。</div>\n  </div><br />\n\n  <div>\n  <span><strong>4.我可否修改交易？ </strong></span>\n    <div>可以，但你必須留意更改交易的條款，如該交易已被全部執行或部份執行便不能修改，但只可修改餘下未被執行之交易。當你確定在群益證券下單系統主頁「即日委託回報」欄下的交易資料被更新後，你便可以輸入新的交易指令。</div></div><br />\n\n  <div>\n  <span><strong>5.我的落盤可同時與多個的掛牌配對嗎？</strong></span>\n   <div>可以的，買賣盤會以市場最好的價格配對，直到閣下的盤價為止。</div></div><br />\n\n  <div>\n  <span><strong>6.我能夠於開市前落盤嗎？</strong></span>\n    <div>可以的。於每個交易日9:00am開始，閣下便可透過群益證券下單系統發出落盤指令到我們的系統裡。當正式開市時，那些盤便會逐一自動送到交易市場。</div></div><br />\n  <div>\n  <span><strong>7.我已輸入的買賣盤可維持多久？</strong></span>\n    <div>閣下輸入的買賣指示，只在落盤當日有效，所有未完成的買賣指示會在當日收巿後取消。</div>\n  </div><br />\n  <div>\n  <span><strong>8.交易狀況的「已掛牌」和「待傳送」有什麼區別？</strong></span>\n    <div>「已掛牌」是指系統已接收買賣指令，並成功送出市場。「傳送中」是指系統已接收買賣指令，但還未送出市場。這種情況一般只出現在開市前和中午休市時發出的買賣盤及離價盤，如在其他情況下出現，我們則建議閣下取消此盤，並從新輸入。</div>\n  </div><br />\n  <div>\n  <span><strong>9.我能查閱過去的買賣紀錄嗎？可以列印到嗎？</strong></span>\n    <div>可以的。閣下可於「成交回報」的「歷史成交回報」部分查閱以往的買賣紀錄。你還可以把紀錄列印出來。</div>\n  </div><br />\n</div>\n<br />\n    <div><strong>戶口資料</strong></div>\n    <div>\n    <div>\n   <span><strong>1.哪些戶口資料可於群益證券下單系統中看到？</strong></span>\n    <div>你可於「證券庫存」和「帳戶結餘」部分看到交易限額、賬戶結餘和持有存貨。而於「歷史成交回報」部分，則可看到你的交易記錄和處理狀況。 </div></div>\n    <br />\n    <div>\n    <span><strong>2.如何更新我的個人密碼？</strong></span>\n    <div>閣下可於群益證券下單系統的「帳戶設定」裡面的「修改密碼」更改自己的登入密碼。</div></div><br />\n\n  <div>\n  <span><strong>3.如何可以訂閱/取消電子對帳單？</strong></span>\n   <div>閣下可於群益證券下單系統的「帳戶設定」裡面的「訂閱/取消電子對帳單」訂閱或取消。</div>\n  </div> <br />\n<div>\n  <span><strong>4.如何於我的戶口提存現金？</strong></span>\n   <div>群益證券下單系統沒有提供網路戶口提存現金的功能，閣下可透過我們的主網頁「交易資料」下的「款項提存方法」了解詳情。</div>\n  </div>\n  </div><br />\n\n    <div><strong>技術操作</strong></div>\n    <div>\n    <div>\n    <span><strong>1.我需要使用哪種瀏覽器？ </strong></span>\n    <div>至少要使用微軟Internet Explorer 6.0或7.0版本的瀏覽器，日後的功能或要求更新的瀏覽器版本。</div></div><br />\n    <div>\n    <span><strong>2.我需要特別的軟件以使用群益證券下單系統嗎？</strong></span>\n    <div>除上述的瀏覽器外，你還要更新Java軟件，你可以按照我們的群益證券下單系統右邊的系統自我檢查去調整你的電腦的設定。</div> </div>\n<br />\n  <div>\n  <span><strong>3.我還是不熟悉群益證券下單系統的操作和畫面，你有詳細的操作手冊給我嗎？</strong></span>\n   <div>閣下可以下載「<a href=\"https://itrade.e-capital.com.hk/Doc/itrade_manual.pdf\">群益香港證券交易系統使用說明</a>」，會得到更詳盡的操作步驟和相關資料。</div></div>\n</div>\n    <br />\n\n    <div><strong>系統保安</strong></div>\n    <div>\n    <div>\n    <span><strong>1.群益證券下單系統提供什麼安全措施以保障我的資料？</strong></span>\n    <div>你開設帳戶時會得到登入名稱和密碼，每次登入加密網頁都需要輸入密碼。這樣才可確保他人不能在未經你授權下使用你的帳戶作交易，你亦可隨時更改密碼。若你的電腦處於閒置狀態30分鐘，系統會自動替你登出。利用微軟Internet Explorer 6.0或以上版本的瀏覽器，我們的安全系統能辨認身分和加密數據。我們利用最先進的128-bit加密系統以加強保安。並且你的所有資料會放置在防火牆後面，以防止被他人竊取。\n</div>\n    </div><br />\n\n    <div>\n    <span><strong>2.多少次密碼輸入錯誤才會暫停我的帳戶呢?</strong></span>\n    <div>連續三次。為保障閣下戶口的安全，若連續輸入錯誤密碼三次，系統會停掉閣下的帳戶。此時閣下需要聯絡經紀去重新啟動閣下的帳戶，重置之後，如果密碼再次輸入錯誤三次，我們會郵寄新密碼給閣下。\n    </div><br />\n    </div>\n  <div>\n  <span><strong>3.登入的用戶名稱和密碼有大小寫之分嗎?</strong></span>\n    <div>用戶名稱並沒有大小寫之分，所以閣下可以用大寫或小寫。但是密碼就有大小寫之分，所以閣下必須留意密碼中的大寫和小寫。當進行第一次登入時，必需要使用和密碼紙條相同的字元輸入(按大/小寫輸入)。否則連續三次輸入不正確的密碼，系統會暫時停掉閣下的帳戶。</div></div><br />\n  <div>\n  <span><strong>4.我是否必須要更改我的密碼?</strong></span>\n    <div>系統不會強制閣下更改密碼。但為安全起見，我們建議你於第一次登入後就馬上更改密碼。而閣下可以隨時更改密碼亦應定期更改密碼，以致減少被人盜用的可能性。</div>\n</div>\n</div>\n</div>"},
      "zh-Hans": {title:"常见问题", body:"<div>\n<div><strong>落盘买卖</strong></div>\n<div>\n<div>\n    <span><strong>1.怎样落盘？</strong></span>\n    <div>当登入群益香港下单系统後，於介面最上方的落盘框按落盘的步骤，并输入所需的资料即可。\n</div>\n    </div><br />\n\n  <div>\n  <span><strong>2.落盘後会有什麽事情发生？ </strong></span>\n    <div>当你输入落盘後，系统会自动弹出提示视窗，把该盘资料汇总并显示出来。内容包括下单帐号、证券名称、证券代号、买卖方向、数量、价格、佣金、其他交易徵费和总金额。确认资料没错後，按下提示窗的「确定」按钮，该盘便会自动送到SEHK。</div></div><br />\n\n  <div>\n  <span><strong>3.我可否取消交易？</strong></span>\n    <div>可以，只要交易尚未执行。但请紧记，因交易进行及取消交易时间的问题，每宗取消交易指示均不保证可以成功执行。若交易已执行，便只可取消余下尚未执行的交易。</div>\n  </div><br />\n\n  <div>\n  <span><strong>4.我可否修改交易？ </strong></span>\n    <div>可以，但你必须留意更改交易的条款，如该交易已被全部执行或部份执行便不能修改，但只可修改余下未被执行之交易。当你确定在群益证券下单系统主页「即日委托回报」栏下的交易资料被更新後，你便可以输入新的交易指令。</div></div><br />\n\n  <div>\n  <span><strong>5.我的落盘可同时与多个的挂牌配对吗？</strong></span>\n   <div>可以的，买卖盘会以市场最好的价格配对，直到阁下的盘价为止。</div></div><br />\n\n  <div>\n  <span><strong>6.我能够於开市前落盘吗？</strong></span>\n    <div>可以的。於每个交易日9:00am开始，阁下便可透过群益证券下单系统发出落盘指令到我们的系统里。当正式开市时，那些盘便会逐一自动送到交易市场。</div></div><br />\n  <div>\n  <span><strong>7.我已输入的买卖盘可维持多久？</strong></span>\n    <div>阁下输入的买卖指示，只在落盘当日有效，所有未完成的买卖指示会在当日收巿後取消。</div>\n  </div><br />\n  <div>\n  <span><strong>8.交易状况的「已挂牌」和「待传送」有什麽区别？</strong></span>\n    <div>「已挂牌」是指系统已接收买卖指令，并成功送出市场。「传送中」是指系统已接收买卖指令，但还未送出市场。这种情况一般只出现在开市前和中午休市时发出的买卖盘及离价盘，如在其他情况下出现，我们则建议阁下取消此盘，并从新输入。</div>\n  </div><br />\n  <div>\n  <span><strong>9.我能查阅过去的买卖纪录吗？可以列印到吗？</strong></span>\n    <div>可以的。阁下可於「成交回报」的「历史成交回报」部分查阅以往的买卖纪录。你还可以把纪录列印出来。</div>\n  </div><br />\n</div>\n<br />\n    <div><strong>户口资料</strong></div>\n    <div>\n    <div>\n   <span><strong>1.哪些户口资料可於群益证券下单系统中看到？</strong></span>\n    <div>你可於「证券库存」和「帐户结余」部分看到交易限额、账户结余和持有存货。而於「历史成交回报」部分，则可看到你的交易记录和处理状况。 </div></div>\n    <br />\n    <div>\n    <span><strong>2.如何更新我的个人密码？</strong></span>\n    <div>阁下可於群益证券下单系统的「帐户设定」里面的「修改密码」更改自己的登入密码。</div></div><br />\n\n  <div>\n  <span><strong>3.如何可以订阅/取消电子对帐单？</strong></span>\n   <div>阁下可於群益证券下单系统的「帐户设定」里面的「订阅/取消电子对帐单」订阅或取消。</div>\n  </div> <br />\n<div>\n  <span><strong>4.如何於我的户口提存现金？</strong></span>\n   <div>群益证券下单系统没有提供网路户口提存现金的功能，阁下可透过我们的主网页「交易资料」下的「款项提存方法」了解详情。</div>\n  </div>\n  </div><br />\n\n    <div><strong>技术操作</strong></div>\n    <div>\n    <div>\n    <span><strong>1.我需要使用哪种浏览器？ </strong></span>\n    <div>至少要使用微软Internet Explorer 6.0或7.0版本的浏览器，日後的功能或要求更新的浏览器版本。</div></div><br />\n    <div>\n    <span><strong>2.我需要特别的软件以使用群益证券下单系统吗？</strong></span>\n    <div>除上述的浏览器外，你还要更新Java软件，你可以按照我们的群益证券下单系统右边的系统自我检查去调整你的电脑的设定。</div> </div>\n<br />\n  <div>\n  <span><strong>3.我还是不熟悉群益证券下单系统的操作和画面，你有详细的操作手册给我吗？</strong></span>\n   <div>阁下可以下载「<a href=\"http://www.e-capital.com.hk/CN/ETtrade/Stock_etrade/pdf/paper2.pdf\">群益香港股市交易系统使用说明</a>」，会得到更详尽的操作步骤和相关资料。</div></div>\n</div>\n    <br />\n\n    <div><strong>系统保安</strong></div>\n    <div>\n    <div>\n    <span><strong>1.群益证券下单系统提供什麽安全措施以保障我的资料？</strong></span>\n    <div>你开设帐户时会得到登入名称和密码，每次登入加密网页都需要输入密码。这样才可确保他人不能在未经你授权下使用你的帐户作交易，你亦可随时更改密码。若你的电脑处於闲置状态30分钟，系统会自动替你登出。利用微软Internet Explorer 6.0或以上版本的浏览器，我们的安全系统能辨认身分和加密数据。我们利用最先进的128-bit加密系统以加强保安。并且你的所有资料会放置在防火墙後面，以防止被他人窃取。\n</div>\n    </div><br />\n\n    <div>\n    <span><strong>2.多少次密码输入错误才会暂停我的帐户呢?</strong></span>\n    <div>连续三次。为保障阁下户口的安全，若连续输入错误密码三次，系统会停掉阁下的帐户。此时阁下需要联络经纪去重新启动阁下的帐户，重置之後，如果密码再次输入错误三次，我们会邮寄新密码给阁下。\n    </div><br />\n    </div>\n  <div><br />\n  <span><strong>3.登入的用户名称和密码有大小写之分吗?</strong></span>\n    <div>用户名称并没有大小写之分，所以阁下可以用大写或小写。但是密码就有大小写之分，所以阁下必须留意密码中的大写和小写。当进行第一次登入时，必需要使用和密码纸条相同的字元输入(按大/小写输入)。否则连续三次输入不正确的密码，系统会暂时停掉阁下的帐户。</div></div><br />\n  <div>\n  <span><strong>4.我是否必须要更改我的密码?</strong></span>\n    <div>系统不会强制阁下更改密码。但为安全起见，我们建议你於第一次登入後就马上更改密码。而阁下可以随时更改密码亦应定期更改密码，以致减少被人盗用的可能性。</div>\n</div>\n</div>\n</div>"},
      "en": {title:"FAQ", body:"<div>\n<div><strong>落盤買賣</strong></div>\n<div>\n<div>\n    <span><strong>1.怎樣落盤？</strong></span>\n    <div>當登入群益香港下單系統後，於介面最上方的落盤框按落盤的步驟，並輸入所需的資料即可。\n落盤後會有什麼事情發生？\n當你輸入落盤後，系統會自動彈出提示視窗，把該盤資料匯總並顯示出來。內容包括下單帳號、証券名稱、証券代號、買賣方向、數量、價格、佣金、其他交易徵費和總金額。確認資料沒錯後，按下提示窗的「確定」按鈕，該盤便會自動送到SEHK。\n</div>\n    </div><br />\n\n  <div>\n  <span><strong>2.我可否取消交易？ </strong></span>\n    <div>可以，只要交易尚未執行。但請緊記，因交易進行及取消交易時間的問題，每宗取消交易指示均不保證可以成功執行。若交易已執行，便只可取消餘下尚未執行的交易。</div></div><br />\n\n  <div>\n  <span><strong>3.我可否修改交易？</strong></span>\n    <div>可以，但你必須留意更改交易的條款，如該交易已被全部執行或部份執行便不能修改，但只可修改餘下未被執行之交易。當你確定在群益證券下單系統主頁「即日委託回報」欄下的交易資料被更新後，你便可以輸入新的交易指令。</div>\n  </div><br />\n\n  <div>\n  <span><strong>4.我的落盤可同時與多個的掛牌配對嗎？ </strong></span>\n    <div>可以的，買賣盤會以市場最好的價格配對，直到閣下的盤價為止。 </div></div><br />\n\n  <div>\n  <span><strong>5.我能夠於開市前落盤嗎？</strong></span>\n   <div>可以的。於每個交易日9:30am開始，閣下便可透過群益證券下單系統發出落盤指令到我們的系統裡。當正式開市時，那些盤便會逐一自動送到交易市場。</div></div><br />\n\n  <div>\n  <span><strong>6.我已輸入的買賣盤可維持多久？</strong></span>\n    <div>閣下輸入的買賣指示，只在落盤當日有效, 所有未完成的買賣指示會在當日收巿後取消。</div></div><br />\n  <div>\n  <span><strong>7.交易狀況的「已掛牌」 和「待傳送」有什麼區別？ </strong></span>\n    <div>「已掛牌」是指系統已接收買賣指令，並成功送出市場。「傳送中」是指系統已接收買賣指令，但還未送出市場。這種情況一般只出現在開市前和中午休市時發出的買賣盤及離價盤，如在其他情況下出現，我們則建議閣下取消此盤，並從新輸入。 </div>\n  </div><br />\n  <div>\n  <span><strong>8.我能查閱過去的買賣紀錄嗎? 可以列印到嗎？</strong></span>\n    <div>可以的.閣下可於「成交回報」 的 「歷史成交回報」部分查閱以往的買賣紀錄. 你還可以把紀錄列印出來.</div>\n  </div>\n</div>\n<br />\n    <div><strong>戶口資料</strong></div>\n    <div>\n    <div>\n   <span><strong>1.哪些戶口資料可於群益證券下單系統中看到？</strong></span>\n    <div>你可於「證券庫存」和「帳戶結餘」部分看到交易限額、賬戶結餘和持有存貨。而於「歷史成交回報」部分，則可看到你的交易記錄和處理狀況。 </div></div>\n    <br />\n    <div>\n    <span><strong>2.如何更新我的個人密碼？ </strong></span>\n    <div>閣下可於群益證券下單系統的\"帳戶設定\"裡面的「修改密碼」更改自己的登入密碼。</div></div><br />\n\n  <div>\n  <span><strong>3.如何可以訂閱/取消電子對帳單？</strong></span>\n   <div>閣下可於 群益證券下單系統的「帳戶設定」裡面的「訂閱/取消電子對帳單」 訂閱 或 取消。</div>\n  </div> <br />\n<div>\n  <span><strong>4.如何於我的戶口提存現金和股票？</strong></span>\n   <div>群益證券下單系統沒有 提供 網路戶口提存現金和股票的功能, 閣下可透過我們的主網頁的交易規則 中的用 「款項提存方法」 提存現金和股票, 之後請閣下盡快聯絡我們以進行確認手續。</div>\n  </div>\n  </div><br />\n\n    <div><strong>技術操作</strong></div>\n    <div>\n    <div>\n    <span><strong>1.我需要使用哪種瀏覽器？ </strong></span>\n    <div>至少要使用微軟 Internet Explorer 6.0或7.0版本的瀏覽器，日後的功能或要求更新的瀏覽器版本。</div></div><br />\n    <div>\n    <span><strong>2.我需要特別的軟件以使用群益證券下單系統嗎？</strong></span>\n    <div>除上述的瀏覽器外，你還要更新Java軟件, 你可以按照我們的群益證券下單系統右邊的系統自我檢查去調整你的電腦的設定。</div> </div>\n<br />\n  <div>\n  <span><strong>3.我還是不熟悉群益證券下單系統的操作和畫面,你有詳細的操作手冊給我嗎？ </strong></span>\n   <div> 有的.閣下可以下載群益證券下單系統操作手冊,會得到更詳盡的操作步驟和相關資料. </div></div>\n</div>\n    <br />\n\n    <div><strong>系統保安</strong></div>\n    <div>\n    <div>\n    <span><strong>1.群益證券下單系統提供什麼安全措施以保障我的資料？</strong></span>\n    <div>你開設帳戶時會得到登入名稱和密碼，每次登入加密網頁都需要輸入密碼。這樣才可確保他人不能在未經你授權下使用你的帳戶作交易，你亦可隨時更改密碼。\n若你的電腦處於閒置狀態 30 分鐘，系統會自動替你登出。 利用微軟 Internet Explorer 6.0或以上版本的瀏覽器，我們的安全系統能辨認身分和加密數據。我們利用最先進的 128-bit 加密系統以加強保安。 並且你的所有資料會放置在防火牆後面，以防止被他人竊取。\n</div>\n    </div><br />\n\n    <div>\n    <span><strong>2.多少次密碼輸入錯誤才會暫停我的帳戶呢?</strong></span>\n    <div>連續三次. 為保障閣下戶口的安全,若連續輸入錯誤密碼三次,系統會停掉閣下的帳戶. 此時閣下需要聯絡經紀去重新啟動閣下的帳戶, 重置之後, 如果密碼再次輸入錯誤三次, 我們會郵寄新密碼給閣下.\n    </div><br />\n    </div>\n  <div>\n  <span><strong>3.登入的用戶名稱和密碼有大小寫之分嗎?</strong></span>\n    <div>用戶名稱並沒有大小寫之分,所以閣下可以用大寫或小寫. 但是密碼就有大小寫之分,所以閣下必須留意密碼中的大寫和小寫. 當進行第一次登入時,必需要使用和密碼紙條相同的字元輸入(大寫用大寫,小寫用小寫). 否則連續三次輸入不正確的密碼,系統會停掉閣下的帳戶.</div></div><br />\n  <div>\n  <span><strong>4.我是否必須要更改我的密碼?</strong></span>\n    <div>不是的. 系統不會強制閣下更改密碼. 但為安全起見,我們建議你於第一次登入後就馬上更改密碼. 而閣下可以隨時更改密碼亦應定期更改密碼,以致減少被人盜用的可能性.</div>\n</div>\n</div>\n</div>"}
    },

      "zh-Hant": {title:"佣金及收費", body:"<div>\n<table>\n  <tr>\n    <td>項目</td>\n    <td>收費</td>\n    </tr>\n  <tr>\n    <td colspan=\"2\"><strong>（A）證券交易服務</strong></td>\n  </tr>\n  <tr>\n    <td>佣金</td>\n    <td>可協商，最低收費港幣100元</td>\n    </tr>\n  <tr>\n    <td>交易徵費</td>\n    <td>每宗交易金額0.003％</td>\n    </tr>\n  <tr>\n    <td>交易費</td>\n    <td>每宗交易金額0.005％</td>\n    </tr>\n  <tr>\n    <td>股票印花稅</td>\n    <td>每宗交易金額0.1％</td>\n    </tr>\n   <tr>\n    <td>投資者賠償徵費</td>\n    <td>於2005年12月19日起暫停徵收</td>\n    </tr>\n  <tr>\n    <td>交易系統使用費</td>\n    <td>豁免</td>\n    </tr>\n  <tr>\n    <td colspan=\"2\"><strong>（B）股票處理及交收服務</strong></td>\n  </tr>\n  <tr>\n    <td>中央結算費 </td>\n    <td>每宗交易金額0.002％，最低收費港幣2元及最高收費港幣100元</td>\n    </tr>\n  <tr>\n    <td>存入股票費（包括實物股票）</td>\n    <td>豁免</td>\n    </tr>\n\n  <tr>\n    <td>過戶契據印花稅（存入實物）</td>\n    <td>每張轉手紙港幣5元</td>\n    </tr>\n  <tr>\n    <td>提取實物股票費</td>\n    <td>每手港幣5元（碎股亦視作一手），最低收費港幣50元</td>\n    </tr>\n  <tr>\n    <td>交收指示（S.I./I.S.I.）</td>\n    <td>每項港幣100元（S.I.）/ 港幣50元（I.S.I.）（轉出股票）</td>\n    </tr>\n     <tr>\n    <td>存倉費</td>\n    <td>豁免</td>\n    </tr>\n  <tr>\n    <td colspan=\"2\"><strong>（C）資訊服務</strong></td>\n  </tr>\n  <tr>\n    <td>即時報價費-AASTOCK</td>\n    <td>香港登入每月港幣360元，中國登入每月港幣210元</td>\n    </tr>\n  <tr>\n    <td colspan=\"2\"><strong>（D）帳戶服務</strong></td>\n  </tr>\n  <tr>\n    <td>託管費</td>\n    <td>豁免</td>\n    </tr>\n  <tr>\n    <td>投資者獨立帳戶服務費</td>\n    <td>每月港幣50元</td>\n  </tr>\n  <tr>\n    <td colspan=\"2\"><strong>（E）代理人服務及企業行動</strong></td>\n  </tr>\n  <tr>\n    <td>登記及過戶費</td>\n    <td>每張及每手股票港幣1.5元，如實體股票另加每張股票港幣20元及服務費港幣200元</td>\n    </tr>\n  <tr>\n    <td>代收現金股息費</td>\n    <td>現金股息總額0.5％，最低收費港幣20元</td>\n    </tr>\n\n  <tr>\n    <td nowrap=\"nowrap\">代收股票股息、供股費、紅股費</td>\n    <td>每隻股票每次港幣30元</td>\n    </tr>\n  <tr>\n    <td>代履行權責</td>\n    <td>每手港幣0.8元，另加每隻股票每次港幣30元服務費（包括換股、供股、私有化、收購等）</td>\n    </tr>\n  <tr>\n    <td>股東會議手續費</td>\n    <td>每宗港幣100元</td>\n    </tr>\n   <tr>\n    <td colspan=\"2\"><strong>（F）借貸及其
