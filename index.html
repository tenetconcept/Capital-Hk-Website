    "stock-sysreq": {
      "zh-Hant": {title:"系統需求", body:"<div>\n  <div>使用群益網上交易服務， 閣下需要符合下列的系統要求，這包括軟體，硬體和連線，若閣下要得到最佳的使用環境，使用建議值會得到最大的操控性和安全性。我們是使用 iTrader 交易引擎作為買賣， 有關 iTrader 的使用問題， 可到這裡瀏覽系統要求如下： </div><br />\n\n<div><strong> 軟體要求：</strong></div>\n<ul>\n  <li> 英文/繁體中文/簡體中文 Microsoft Windows 95/98/ME/NT 4.0/2000/XP </li>\n  <li> Microsoft Internet Explorer 4.0 (附加上 Microsoft Internet Explorer High Encryption Pack)? 或以上 (建議 IE 5.5 SP2 或以上) 以取得最佳的瀏覽性和安全性 </li>\n  <li> 已安裝 Microsoft Virtual Machine 5.00 Build 3809 或以上 按此下載 </li>\n  <li> 已從 Windows Update 上為閣下的 Windows 和 IE 安裝好最新的元件以最得 Microsoft 建議的安全性 </li>\n  <li> 繁體中文/簡體中文字體顯示支援(若要使用和閣下的 Windows 版本不同的中文字) </li>\n  <li> 不支援任何網景或其他瀏覽器 </li>\n  <li> 註：若閣下使用英文 Windows，但希望使用繁/簡中文界面，即使已安裝繁/簡中文字體顯示支援，閣下仍可能於某些版面上看不到正常的中文字。</li>\n</ul><br />\n\n<div><strong>硬體要求： </strong></div>\n<ul>\n<li>Intel Pentium 200MHz 或以上 (建議 Pentium III 500MHz 或以上) </li>\n<li>最少 64MB RAM (建議 128MB 或以上) </li>\n<li>最少 100MB 硬碟空間 </li>\n</ul><br />\n\n  <div><strong> 連接要求：</strong></div>\n<ul>\n<li>最少 56Kbps 數據機連線速度及已連線到互聯網 (建議 1.5Mbps 或以上寬頻及已連線到互聯網) </li>\n</ul><br />\n\n<div><strong> iTrader交易引擎自動化安裝程序：</strong></div>\n<ul>\n<li>先連線到互聯網</li>\n<li>到達我們的網站， 於 『網上買賣』部份內的右上角選擇閣下所需要的語言版本，這包括：『繁體中文』， 『簡體中文』和『English』</li>\n<li>請按一下『網上買賣』 或 『即時下單』</li>\n<li>IE畫面上會跳出兩個有 EBROKER SYSTEMS LIMITED 所發出的『安全性警告』 時， 請 上『永遠信任來自EBROKER SYSTEMS LIMITED的內容』， 然後按 『是』 去接受下載和安裝程式。第一次下載會使用大概四至五分鐘， 下載所所需的時間是視乎連線速度而定。之後的下載只會花上數秒鐘。 </li>\n<li> 當閣下看到登入畫面時， 已表示安裝成功！請輸入用戶名稱和密碼登入群益網上買賣系統！</li>\n</ul><br />\n\n<div><strong>技術支援：</strong></div>\n<ul>\n<span><strong>1. 群益如何營造安全交易環境？</strong></span><br />\n<div>\n本公司已實施以下措施，以確保您戶口資料及交易活動的安全：\n<li> 獨一無二的用戶名稱及密碼；及</li><br />\n<li> 我們採用了嚴密的保護措施，例如防火牆、加密及 SSL (Secure Socket Layers) 等，來保護你的個人資料，避免遺失、遭盜用、或未經授權的存取與揭露。</li><br />\n    </div>\n<br />\n<span><strong>2.	本人應如何防止網上戶口遭未經授權者使用？</strong></span><br />\n<div>\n為預防閣下戶口遭未經授權者使用，請：\n<li> 於首次成功登入戶口後，儘快更改閣下的密碼；</li><br />\n<li> 把用戶名稱及密碼多加保密；及</li><br />\n<li> 不時更改閣下的密碼。</li><br />\n</div>\n<div>如閣下對其戶口資料有任何查詢，請聯絡為閣下服務的經紀。閣下應知悉，對任何未經授權者使用閣下網上交易戶口導致的一切效果，本公司將不負任何責任。因此，閣下應盡全力把用戶名稱及用戶密碼等個人資料保密及加以防範。</div>\n<br />\n<span><strong>3.	若與他人共用電腦，本人如何保護戶口資料不被盜用？</strong></span><br />\n<div>為防止閣下戶口資料被盜用，閣下必須於每次註銷後，刪除暫存檔、瀏覽記錄及密碼，並關閉互聯網路流覽器。您可於Microsoft有關Internet Explorer的常見問題內找到相關詳情。<br />\n於互聯網上傳遞之訊息並不保證絕對保密。用戶因透過互聯網向本公司傳送訊息，或要求本公司透過互聯網向其發出之訊息如有任何延誤、損失、變更、改動或訛誤，本公司對因此而引致之任何損失概不負責。本公司亦對使用此網站而招致之任何直接、間接、特別或連帶之損失不負任何責任。<br />\n</div>\n<br />\n<span><strong>4.	使用互聯網路交易時，何種情況可能導致延誤執行買賣指令？</strong></span><br />\n<div>若於交易日特定時間內互聯網路交易交投量太大，則可能導致延誤執行買賣指令，及可能導致閣下買賣指令價與市價之間出現差異。再者，若互聯網路交通繁忙，或系統容量有限，將可能妨礙閣下使用網上戶口及/或輸入買賣指令。\n</div>\n<br />\n<span><strong>5.	如本人有任何技術性問題，應怎樣聯絡群益？</strong></span><br />\n<div>\n如閣下有任何技術性問題，請聯絡本公司技術支援部：\n<table >\n   <tr>\n    <td>電話：      </td>\n    <td><p>(852) 2105-1152</p></td>\n  </tr>\n  <tr >\n    <td>電郵地址：</td>\n    <td><a href=\"mailto:hk_it@e-captial.com.hk\">hk_it@e-captial.com.hk</a></td>\n  </tr>\n  <tr>\n    <td>辦公時間：</td>\n    <td><p>星期一至五</p></td>\n  </tr>\n  <tr>\n    <td>&nbsp;</td>\n    <td>上午9時至下午6時</td>\n  </tr>\n</table>\n</div>\n</ul>\n</div>"},
      "zh-Hans": {title:"系统需求", body:"<div>\n<div>使用群益网上交易服务， 阁下需要符合下列的系统要求，这包括软体，硬体和连线，若阁下要得到最佳的使用环境，使用建议值会得到最大的操控性和安全性。我们是使用 iTrader 交易引擎作为买卖， 有关 iTrader 的使用问题， 可到这里浏览系统要求如下： </div><br />\n\n<div><strong> 软体要求：</strong></div>\n<ul>\n<li> 英文/繁体中文/简体中文 Microsoft Windows 95/98/ME/NT 4.0/2000/XP </li>\n<li> Microsoft Internet Explorer 4.0 (附加上 Microsoft Internet Explorer High Encryption Pack)? 或以上 (建议 IE 5.5 SP2 或以上) 以取得最佳的浏览性和安全性 </li>\n<li> 已安装 Microsoft Virtual Machine 5.00 Build 3809 或以上 按此下载 </li>\n<li> 已从 Windows Update 上为阁下的 Windows 和 IE 安装好最新的元件以最得 Microsoft 建议的安全性 </li>\n<li> 繁体中文/简体中文字体显示支援(若要使用和阁下的 Windows 版本不同的中文字) </li>\n<li> 不支援任何网景或其他浏览器 </li>\n<li> 注：若阁下使用英文 Windows，但希望使用繁/简中文界面，即使已安装繁/简中文字体显示支援，阁下仍可能於某些版面上看不到正常的中文字。</li>\n</ul><br />\n\n<div><strong>硬体要求： </strong></div>\n<ul>\n<li>Intel Pentium 200MHz 或以上 (建议 Pentium III 500MHz 或以上) </li>\n<li>最少 64MB RAM (建议 128MB 或以上) </li>\n<li>最少 100MB 硬碟空间 </li>\n</ul><br />\n\n<div><strong> 连接要求：</strong></div>\n<ul>\n<li>最少 56Kbps 数据机连线速度及已连线到互联网 (建议 1.5Mbps 或以上宽频及已连线到互联网) </li>\n</ul><br />\n\n<div><strong> iTrader交易引擎自动化安装程序：</strong></div>\n<ul>\n<li>先连线到互联网</li>\n<li>到达我们的网站， 於 『网上买卖』部份内的右上角选择阁下所需要的语言版本，这包括：『繁体中文』， 『简体中文』和『English』</li>\n<li>请按一下『网上买卖』 或 『即时下单』</li>\n<li>IE画面上会跳出两个有 EBROKER SYSTEMS LIMITED 所发出的『安全性警告』 时， 请 上『永远信任来自EBROKER SYSTEMS LIMITED的内容』， 然後按 『是』 去接受下载和安装程式。第一次下载会使用大概四至五分钟， 下载所所需的时间是视乎连线速度而定。之後的下载只会花上数秒钟。 </li>\n<li>当阁下看到登入画面时， 已表示安装成功！请输入用户名称和密码登入群益网上买卖系统！</li>\n</ul><br />\n\n<div><strong>技术支援：</strong></div>\n\n<ul>\n<span><strong>1. 群益如何营造安全交易环境？</strong></span><br />\n<div>\n本公司已实施以下措施，以确保您户口资料及交易活动的安全：\n<li>独一无二的用户名称及密码；及 </li><br />\n<li>我们采用了严密的保护措施，例如防火墙、加密及 SSL (Secure Socket Layers) 等，来保护你的个人资料，避免遗失、遭盗用、或未经授权的存取与揭露。</li><br />\n    </div>\n<br />\n<span><strong>2.	本人应如何防止网上户口遭未经授权者使用？</strong></span><br />\n<div>\n为预防阁下户口遭未经授权者使用，请：\n<li>於首次成功登入户口後，尽快更改阁下的密码； </li><br />\n<li>把用户名称及密码多加保密；及 </li><br />\n<li>不时更改阁下的密码。 </li><br />\n</div>\n<div>\n如阁下对其户口资料有任何查询，请联络为阁下服务的经纪。阁下应知悉，对任何未经授权者使用阁下网上交易户口导致的一切效果，本公司将不负任何责任。因此，阁下应尽全力把用户名称及用户密码等个人资料保密及加以防范。</li><br />\n</div>\n<br />\n<span><strong>3.	若与他人共用电脑，本人如何保护户口资料不被盗用？</strong></span><br />\n<div>为防止阁下户口资料被盗用，阁下必须於每次注销後，删除暂存档、浏览记录及密码，并关闭互联网路流览器。您可於Microsoft有关Internet Explorer的常见问题内找到相关详情。<br />\n於互联网上传递之讯息并不保证绝对保密。用户因透过互联网向本公司传送讯息，或要求本公司透过互联网向其发出之讯息如有任何延误、损失、变更、改动或讹误，本公司对因此而引致之任何损失概不负责。本公司亦对使用此网站而招致之任何直接、间接、特别或连带之损失不负任何责任。<br />\n</div>\n<br />\n<span><strong>4.	使用互联网路交易时，何种情况可能导致延误执行买卖指令？</strong></span><br />\n<div>若於交易日特定时间内互联网路交易交投量太大，则可能导致延误执行买卖指令，及可能导致阁下买卖指令价与市价之间出现差异。再者，若互联网路交通繁忙，或系统容量有限，将可能妨碍阁下使用网上户口及/或输入买卖指令。\n</div>\n<br />\n<span><strong>5.	如本人有任何技术性问题，应怎样联络群益？</strong></span><br />\n<div>\n如阁下有任何技术性问题，请联络本公司技术支援部：\n<table >\n   <tr>\n    <td>电话：      </td>\n    <td><p>(852) 2105-1152</p></td>\n  </tr>\n  <tr >\n    <td>电邮地址：</td>\n    <td><a href=\"mailto:hk_it@e-captial.com.hk\">hk_it@e-captial.com.hk</a></td>\n  </tr>\n  <tr>\n    <td>办公时间：</td>\n    <td>星期一至五</td>\n  </tr>\n  <tr>\n    <td>&nbsp;</td>\n    <td>上午9时至下午6时</td>\n  </tr>\n</table>\n</div>\n</ul>"},
      "en": {title:"System Requirements", body:"<div>\n  <div>To use CSC e-Trading Service, you have to fulfill the following system requirements which include software, hardware and connection. If you want to have the best using environment, we recommend you to use the recommended configuration to acquire the maximum reliability and security. We utilize iTrader trading engine for trading operations. Please read here if you have any question about this trading engine. <br />\n    <p>System Requirements are as follows:</p>\n  </div><br />\n\n<div><strong>Software Requirements:</strong></div>\n<ul>  <li> English/Traditional Chinese/Simplified Chinese Microsoft Windows 95/98/ME/NT 4.0/2000/XP </li>\n<li> Microsoft Internet Explorer 4.0 (Installed Microsoft Internet Explorer High Encryption Pack) or above (IE 5.5 SP2 or above is recommended) to acquire the best browsing experience and security level. </li>\n<li> Installed Microsoft Virtual Machine 5.00 Build 3809 or above<a href=\"http://www.capital.com.tw/Download/msjavx86.exe\"> Download Here</a> .\n<li> Installed latest components for your Windows and IE from Windows Update to acquire the best Microsoft recommended security level. </li>\n<li> Traditional Chinese/Simplified Chinese Fonts Support (If you want to use different languages from your Windows native language) </li>\n<li> Do NOT support any version of Netscape browsers and other browsers.</li>\n<li> Note: If you use English Windows version but at the same time want to use Traditional Chinese/Simplified Chinese interface, you will not be able to read Chinese texts normally in certain pages even though you have installed the Chinese fonts support. </li>\n</ul><br />\n\n<div><strong>Hardware Requirements: </strong></div>\n<ul>\n<li>Intel Pentium 200MHz or above (Pentium III 500MHz or above recommended) </li>\n<li>At least 64MB RAM (128MB or above recommended)</li>\n<li>At least 100MB hard disk free space</li>\n</ul><br />\n\n  <div><strong>Connection Requirement:</strong></div>\n<ul>\n<li>At least 56Kbps modem speed and connected to Internet (1.5Mbps or above broadband speed and connected to Internet recommended) </li>\n</ul><br />\n\n<div><strong>iTrader Trading Engine Automatic Installation Process:</strong></div>\n<ul>\n<li>Connect to Internet </li>\n<li>Go to our website, enter to \"e-Trade\" section and select your preferred language at the top right hand corner which including: \"Traditional Chinese\", \"Simplified Chinese\" and \"English\" </li>\n<li>Please click \"e-Trade\" or \"Trade Now\". </li>\n<li>IE will pop up two \"Security Warning\" boxes issued by EBROKER SYSTEMS LIMITED. Please go to the box of \"Permanently Trust the Content From EBROKER SYSTEMS LIMITED\", then click \"Yes\" to accept and download the applications. The first download takes approximately four to five minutes. The download time taken depends on the connection speed. Subsequent downloads only take some seconds. </li>\n<li>When you see the login screen that means your installation is successful. Please enter your username and password to logon CSC e-Trading System. </li>\n</ul><br />\n\n<div><strong>Technical Support:</strong></div>\n<ul>\n<span><strong>1. How does CSC create a safe trading environment? </strong></span><br />\n<div>\nOur Company has implemented the following measures to secure your personal information and trading activities:：\n<li> Unique User Name and Password; and</li><br />\n<li> We use procedural and technical safeguards, including firewalls, encryption, and Secure Socket Layers (SSL) to help protect your personal information against loss, theft, and unauthorized access and disclosure by users inside and outside the Company.</li><br />\n    </div>\n<br />\n<span><strong>2.	How can I protect my online account from unauthorized access? </strong></span><br />\n<div>\nIn order to protect your online account from unauthorized access, please:\n<li> Change your password immediately after you login your account for the first time;</li><br />\n<li> Keep your User Name and Trading Password confidential; and</li><br />\n<li> Change your password periodically.</li><br />\n</div>\n<div>Contact our Account Executive for assistance if you feel doubt about your account information. Our Company will not be held responsible for any consequences resulting from unauthorized access to your online trading account. Therefore, please keep your trading information such as trading password and user name confidential.</div>\n<br />\n<span><strong>3. If I am sharing my computer with someone else, how can I protect my account information from being stolen?</strong></span><br />\n<div>To avoid account information from being stolen, you should delete temporary Internet files, browsing history and password before you close the browser window. You may refer to FAQ of Internet Explorer in Microsoft's website for guidance.\n<br />\nMessages sent over the Internet cannot be guaranteed to be completely secure. The Company will not be responsible for any damages incurred by users as a result of any delay, loss, diversion, alteration or corruption of any message either sent to or received from the Company at the users' request, over the Internet. The Company is not responsible in any manner for direct, indirect, special or consequential damages arising out of the use of this website.\n<br />\n</div>\n<br />\n<span><strong>4.What events will cause delays in order execution? </strong></span><br />\n<div>High volume of Internet trading during a specific time of a trading day may cause delay in order execution. This may also lead to a difference between your pre-set order price and the actual market price. In addition, Internet traffic or system capacity may hinder you from accessing your Internet trading account and/or placing orders.\n</div>\n<br />\n<span><strong>5. Who should I contact if I have any queries? </strong></span><br />\n<div>\nShould you have any technical problem, please kindly contact us.\n<table >\n   <tr>\n    <td>Tel.:      </td>\n    <td><p>(852) 2105-1152</p></td>\n  </tr>\n  <tr >\n    <td>Email:</td>\n    <td><a href=\"mailto:hk_it@e-captial.com.hk\">hk_it@e-captial.com.hk</a></td>\n  </tr>\n  <tr>\n    <td>Office Hour:</td>\n    <td><p>Monday to Friday</p></td>\n  </tr>\n  <tr>\n    <td>&nbsp;</td>\n    <td>09:00a.m.~06:00p.m.</td>\n  </tr>\n</table>\n</div>\n</ul>\n</div>\n</div>"}

      "zh-Hant": {title:"交易時間表", body:"<div>\n<div>更新日期：2011年3月7日</div>\n<div><strong> 證券市場交易日誌及交易時間</strong></div>\n<table>\n    <tr>\n          <td colspan=\"2\"><strong>競價時段</strong></td>\n        </tr>\n        <tr>\n          <td>開市前時段</td>\n          <td>上午9時正至上午9時30分</td>\n        </tr>\n        <tr>\n          <td colspan=\"2\"><strong>持續交易時段</strong></td>\n        </tr>\n        <tr>\n          <td>早市</td>\n          <td>上午9時30分至中午12時正</td>\n        </tr>\n        <tr>\n          <td>延續早市</td>\n          <td>中午12時正至下午1時00分</td>\n        </tr>\n        <tr>\n          <td>午市</td>\n          <td>下午1時00分至下午4時正</td>\n        </tr>\n    </table>\n  <div>在聖誕前夕、新年前夕及農曆新年前夕，將沒有延續早市及午市交易。要是當天沒有早市交易，當天也不會有延續早市交易。</div>\n    <br />\n\n  <div><strong> 期貨及指數期權交易時間</strong></div>\n  <table>\n<tr>\n          <td><strong>合約</strong></td>\n          <td><strong>時段</strong></td>\n          <td><strong>交易時間*</strong></td>\n          <td><strong>最後交易日 / 到期日之<br />\n          交易時間(即月合約)</strong></td>\n          <td><strong>開市前時段</strong></td>\n        </tr>\n        <tr>\n          <td rowspan=\"2\">恒生指數期貨<br />\n            小型恒生指數期貨<br />\n            H股指數期貨</td>\n          <td>早市</td>\n          <td>上午9時15分至中午12時正</td>\n          <td>上午9時15分至中午12時正</td>\n          <td>上午8時45分 - 上午9時15分</td>\n        </tr>\n        <tr>\n          <td>午市</td>\n          <td>下午1時30分 - 下午4時15分</td>\n          <td>下午1時30分 - 下午4時00分</td>\n          <td>下午1時正 - 下午1時30分</td>\n        </tr>\n        <tr>\n          <td rowspan=\"2\">\n            小型H股指數期貨<br />\n            H股指數期權 <br />\n            恒生指數期權<br />\n            小型恒生指數期權</td>\n          <td>早市</td>\n          <td>上午9時15分至中午12時正</td>\n          <td>上午9時15分至中午12時正</td>\n          <td>不適用</td>\n        </tr>\n        <tr>\n          <td>午市</td>\n          <td>下午1時30分 - 下午4時15分</td>\n          <td>下午1時30分 - 下午4時00分</td>\n          <td>不適用</td>\n        </tr>\n    </table>\n      <div>*備註：\n股票指數期貨及期權和股票期貨的半日市收市時間是下午十二時三十分。</div>\n</div>"},
      "zh-Hans": {title:"交易时间表", body:"<div>\n<div>更新日期：2011年3月7日</div>\n<div><strong> 证券市场交易日志及交易时间</strong></div>\n\n<div>交易於周一至周五(公众假期除外)进行，交易时间如下：</div>\n<table>\n    <tr>\n          <td colspan=\"2\"><strong>竞价时段</strong></td>\n        </tr>\n        <tr>\n          <td>开市前时段</td>\n          <td>上午9时正至上午9时30分</td>\n        </tr>\n        <tr>\n          <td colspan=\"2\"><strong>持续交易时段</strong></td>\n        </tr>\n        <tr>\n          <td>早市</td>\n          <td>上午9时30分至中午12时正</td>\n        </tr>\n        <tr>\n          <td>延续早市</td>\n          <td>中午12时正至下午1时30分</td>\n        </tr>\n        <tr>\n          <td>午市</td>\n          <td>下午1时30分至下午4时正</td>\n        </tr>\n    </table>\n<div>在圣诞前夕、新年前夕及农历新年前夕，将没有延续早市及午市交易。要是当天没有早市交易，当天也不会有延续早市交易。</div>\n<br />\n\n<div><strong> 期货及指数期权交易时间</strong></div>\n<table>\n    <tr>\n          <td><strong>合约</strong></td>\n          <td><strong>时段</strong></td>\n          <td><strong>交易时间*</strong></td>\n          <td><strong>最後交易日 / 到期日之<br />\n  交易时间(即月合约)</strong></td>\n          <td><strong>开市前时段</strong></td>\n        </tr>\n        <tr>\n          <td rowspan=\"2\">恒生指数期货<br />\n            小型恒生指数期货<br />\n           H股指数期货</td>\n          <td>早市</td>\n          <td>上午9时15分至中午12时正</td>\n          <td>上午9时15分至中午12时正</td>\n          <td>上午8时45分 - 上午9时15分</td>\n        </tr>\n        <tr>\n          <td>午市</td>\n          <td>下午1时30分 - 下午4时15分</td>\n          <td>下午1时30分 - 下午4时00分</td>\n          <td>下午1时正 - 下午1时30分</td>\n        </tr>\n        <tr>\n          <td rowspan=\"2\">\n            小型H股指数期货<br />\n            H股指数期权 <br />\n            恒生指数期权<br />\n          小型恒生指数期权</td>\n          <td>早市</td>\n          <td>上午9时15分至中午12时正</td>\n          <td>上午9时15分至中午12时正</td>\n          <td>不适用</td>\n        </tr>\n        <tr>\n          <td>午市</td>\n          <td>下午1时30分 - 下午4时15分</td>\n          <td>下午1时30分 - 下午4时00分</td>\n          <td>不适用</td>\n        </tr>\n    </table>\n<div>*备注：\n股票指数期货及期权和股票期货的半日市收市时间是下午十二时三十分。</div>\n</div>"},
      "en": {title:"Trading Hours", body:"<div>\n<div>Updated：2011.4.15</div>\n<div><strong> Securities Market</strong></div>\n\n<div>Trading is conducted on Monday to Friday (excluding public holidays) at the following times:</div>\n<table>\n        <tr>\n          <td colspan=\"2\"><strong>Auction Session</strong></td>\n        </tr>\n        <tr>\n          <td>Pre-opening Session</td>\n          <td>9:00 a.m. to 9:30 a.m.</td>\n        </tr>\n        <tr>\n          <td colspan=\"2\"><strong>Continuous Trading Session</strong></td>\n        </tr>\n        <tr>\n          <td>Morning Session</td>\n          <td>9:30 a.m. to 12:00 noon</td>\n        </tr>\n        <tr>\n          <td>Extended Morning Session</td>\n          <td>12:00 noon to 1:30 p.m.</td>\n        </tr>\n        <tr>\n          <td>Afternoon Session</td>\n          <td>1:30 p.m. to 4:00 p.m</td>\n        </tr>\n    </table>\n  <div>There is no Extended Morning Session and Afternoon Session on the eves of Christmas, New Year and Lunar New Year. There will be no Extended Morning Session if there is no Morning Session.</div>\n    <br />\n\n  <div><strong> Futures & Index Options </strong></div>\n<table>\n        <tr>\n          <td><strong>Contract</strong></td>\n          <td><h5><strong>Trading Session</strong></h5></td>\n          <td><strong>Trading Hours*</strong></td>\n          <td><strong>Trading Hours on Last Trading Day (Spot Month Contract)</strong></td>\n          <td><strong>Pre Market Opening Period</strong></td>\n        </tr>\n        <tr>\n          <td rowspan=\"2\">Hang Seng Index Futures</br></br>\n          Mini-Hang Seng Index Futures</br></br>\n          H-shares Index Futures\n</td>\n          <td><p>Morning Session</p></td>\n          <td>9:15 a.m. - 12:00 noon</td>\n          <td>9:15 a.m. - 12:00 noon</td>\n          <td>8:45 a.m. - 9:15 a.m.</td>\n        </tr>\n        <tr>\n          <td><p>Afternoon Session</p></td>\n          <td>1:30 p.m. - 4:15 p.m.</td>\n          <td>1:30 p.m. - 4:00 p.m.</td>\n          <td>1:00 p.m. - 1:30 p.m.</td>\n        </tr>\n        <tr>\n          <td rowspan=\"2\">\n            Mini H-shares Index Futures<br /><br />\n            H-shares Index Options (Including Flexible Index Options)<br /><br />\n            Hang Seng Index Options (Including Flexible Index Options)<br /><br />\n            Mini-Hang Seng Index Options\n</td>\n          <td><p>Morning Session</p></td>\n          <td>9:15 a.m. - 12:00 noon</td>\n          <td>9:15 a.m. - 12:00 noon</td>\n          <td>Not applicable\n</td>\n        </tr>\n        <tr>\n          <td><p>Afternoon Session</p></td>\n          <td>1:30 p.m. - 4:15 p.m.</td>\n          <td>1:30 p.m. - 4:00 p.m.</td>\n          <td>Not applicable\n</td>\n        </tr>\n    </table>\n\n</div>"}

      "zh-Hant": {title:"網上交易聲明", body:"<div>於使用群益提供的網上交易服務時，客戶確認已詳閱、明白及同意接受以下條款及細則：<br />\n  <br />\n  <ol>\n    <li>本人／吾等／本公司同意使用互聯網作為網上交易及網上通訊，轉遞資訊、數據及文件給本人／吾等／本公司的媒體。本人／吾等／本公司明白網上交易及服務為主要交易或通訊媒體，但本人／吾等／本公司仍可使用其他可行的聯擊方法，如電話。 </li>\n    <li>本人／吾等／本公司承認有關於互聯網服務及帳戶的使用、營運、政策及程序的資料已於網址供本人／吾等／本公司取得，而本人／吾等／本公司已閱讀及明白其條款可能不時被修改，而本人／吾等／本公司使用互聯服務及帳戶則該等條款被視為對本人／吾等／本公司具有約束力。倘本協議的條款與該等資料出現任何歧異之處，應以本協議的條款為準。 </li>\n    <li>本人／吾等／本公司同意只根據已簽訂之客戶交易協議(如適用)的條款及本公司的網站規定使用網上服務。 </li>\n    <li>本人／吾等／本公司為網上服務的唯一獲授權用戶，並承認該服務可能需要本人／吾等／本公司使用各種識別及存取代碼，包括密碼、私人識別碼及其他用戶識別號碼，以取用該服務及本人／吾等／本公司的帳戶。而本人／吾等／本公司對本人／吾等／本公司就所有透過該服務而產生的交易之密碼、私人識別碼、用戶識別及帳戶號碼的保密及恰當使用於任何時間都會負全責及負責所有透過該服務而產生的交易。 </li>\n    <li>本人／吾等／本公司同意於本人／吾等／本公司知悉出現任何損失、盜竊或未獲授權使用本人／吾等／本公司的密碼、私人識別碼及其他用戶識別、帳戶或帳戶號碼，或任何未獲授權使用網上服務或以之提供任何市場資訊或數據時，即時通知　貴公司。 </li>\n    <li>本人／吾等／本公司承認任何透過網上服務或另行以電話、電子或其他方式提供的任何資料及數據（包括新聞及實時報價）乃是　貴公司從交易所、交易市場及　貴公司不時委聘的可能與　貴公司有關連或沒有關連的其他第三者服務提供者所取得。\n  <p>本人／吾等／本公司進一步承認及接受： </p>\n  <ul>\n    <li>-該等資料及數據受或可能受版權法律的保護，並提供給本人／吾等／本公司只是作私人及非商業性的用途。本人／吾等／本公司不可以在未經　貴公司、交易所或服務提供者的准許下使用、再製造、再傳遞、發放、出售、分佈、出版、轉播、散佈或作其他商業用途；及 </li>\n    <li>-該等資料及數據乃由　貴公司從相信是可靠的來源所獲取而來，　貴公司、交易所或服務提供者並不擔保任何該等資料及數據的準確性、足夠性、完整性、即時性及先後次序。 </li></ul>\n    <li>本人／吾等／本公司承認同意不論　貴公司或任何服務提供者均不會就本人／吾等／本公司倚賴任何該等透過互聯網服務提供的資料或數據，或該等資料或數據的可用性、準確性、完整性或即時性，或本人／吾等／本公司依賴該資料或數據而採取的行動或作出的決定而對本人／吾等／本公司負責。 </li>\n    <li>本人／吾等／本公司承認網上服務的一切所有權及版權及其他知識版權均為　貴公司專屬的資產或是屬於有關服務提供者的，並同意及承諾除本協議所授權外，本人／吾等／本公司不得於任何時間企圖竄改、變更、或另行以任何形式更改，或另行取用或企圖得到取用互聯網服務任何部份。本人／吾等／本公司更承諾倘知悉出現任何其他人士的任何該等不獲授權的使用或取用互聯網服務時，即時通知　貴公司。 </li>\n    <li>本人／吾等／本公司同意支付一切　貴公司可不時就使用網上服務而收取的申領、服務及使用費。 </li>\n    <li>儘管本協議的任何規定，　貴公司有絕對酌情權於任何時間在毋須任何通知及無任何規限下，不論因任何原因，包括本人／吾等／本公司任何未獲授權的使用該等服務及／或任何資料或數據或任何密碼、私人識別碼及其他用戶識別或帳戶號碼，終止本人／吾等／本公司取用網上服務或從任何服務提供者處取用任何資料或數據或其任何部份之權利，而毋須對本人／吾等／本公司負責。 </li>\n    <li>本人／吾等／本公司將負擔　貴公司及於被要求時償付　貴公司任何及一切因本人／吾等／本公司之任何未獲授權而使用網上服務及／或任何資料或數據而引起的索償、索求、訴訟、損失、損害賠償、費用（包括以完全補償基準計算的訴訟費及開支）及支出。 </li>\n  </ol>\n</div>"},
      "zh-Hans": {title:"网上交易声明", body:"<div>於使用群益提供的网上交易服务时，客户确认已详阅、明白及同意接受以下条款及细则：<br />\n  <br />\n<ol>\n    <li>本人／吾等／本公司同意使用互联网作为网上交易及网上通讯，转递资讯、数据及文件给本人／吾等／本公司的媒体。本人／吾等／本公司明白网上交易及服务为主要交易或通讯媒体，但本人／吾等／本公司仍可使用其他可行的联击方法，如电话。 </li>\n    <li>本人／吾等／本公司承认有关於互联网服务及帐户的使用、营运、政策及程序的资料已於网址供本人／吾等／本公司取得，而本人／吾等／本公司已阅读及明白其条款可能不时被修改，而本人／吾等／本公司使用互联服务及帐户则该等条款被视为对本人／吾等／本公司具有约束力。倘本协议的条款与该等资料出现任何歧异之处，应以本协议的条款为准。 </li>\n    <li>本人／吾等／本公司同意只根据已签订之客户交易协议(如适用)的条款及本公司的网站规定使用网上服务。 </li>\n    <li>本人／吾等／本公司为网上服务的唯一获授权用户，并承认该服务可能需要本人／吾等／本公司使用各种识别及存取代码，包括密码、私人识别码及其他用户识别号码，以取用该服务及本人／吾等／本公司的帐户。而本人／吾等／本公司对本人／吾等／本公司就所有透过该服务而产生的交易之密码、私人识别码、用户识别及帐户号码的保密及恰当使用於任何时间都会负全责及负责所有透过该服务而产生的交易。 </li>\n    <li>本人／吾等／本公司同意於本人／吾等／本公司知悉出现任何损失、盗窃或未获授权使用本人／吾等／本公司的密码、私人识别码及其他用户识别、帐户或帐户号码，或任何未获授权使用网上服务或以之提供任何市场资讯或数据时，即时通知　贵公司。 </li>\n    <li>本人／吾等／本公司承认任何透过网上服务或另行以电话、电子或其他方式提供的任何资料及数据（包括新闻及实时报价）乃是　贵公司从交易所、交易市场及　贵公司不时委聘的可能与　贵公司有关连或没有关连的其他第三者服务提供者所取得。\n  <p>本人／吾等／本公司进一步承认及接受： </p>\n  <ul>\n    <li>-该等资料及数据受或可能受版权法律的保护，并提供给本人／吾等／本公司只是作私人及非商业性的用途。本人／吾等／本公司不可以在未经　贵公司、交易所或服务提供者的准许下使用、再制造、再传递、发放、出售、分布、出版、转播、散布或作其他商业用途；及 </li>\n    <li>-该等资料及数据乃由　贵公司从相信是可靠的来源所获取而来，　贵公司、交易所或服务提供者并不担保任何该等资料及数据的准确性、足够性、完整性、即时性及先後次序。 </li></ul>\n    <li>本人／吾等／本公司承认同意不论　贵公司或任何服务提供者均不会就本人／吾等／本公司倚赖任何该等透过互联网服务提供的资料或数据，或该等资料或数据的可用性、准确性、完整性或即时性，或本人／吾等／本公司依赖该资料或数据而采取的行动或作出的决定而对本人／吾等／本公司负责。 </li>\n    <li>本人／吾等／本公司承认网上服务的一切所有权及版权及其他知识版权均为　贵公司专属的资产或是属於有关服务提供者的，并同意及承诺除本协议所授权外，本人／吾等／本公司不得於任何时间企图窜改、变更、或另行以任何形式更改，或另行取用或企图得到取用互联网服务任何部份。本人／吾等／本公司更承诺倘知悉出现任何其他人士的任何该等不获授权的使用或取用互联网服务时，即时通知　贵公司。 </li>\n    <li>本人／吾等／本公司同意支付一切　贵公司可不时就使用网上服务而收取的申领、服务及使用费。 </li>\n    <li>尽管本协议的任何规定，　贵公司有绝对酌情权於任何时间在毋须任何通知及无任何规限下，不论因任何原因，包括本人／吾等／本公司任何未获授权的使用该等服务及／或任何资料或数据或任何密码、私人识别码及其他用户识别或帐户号码，终止本人／吾等／本公司取用网上服务或从任何服务提供者处取用任何资料或数据或其任何部份之权利，而毋须对本人／吾等／本公司负责。 </li>\n    <li>本人／吾等／本公司将负担　贵公司及於被要求时偿付　贵公司任何及一切因本人／吾等／本公司之任何未获授权而使用网上服务及／或任何资料或数据而引起的索偿、索求、诉讼、损失、损害赔偿、费用（包括以完全补偿基准计算的诉讼费及开支）及支出。 </li>\n  </ol>\n  </div>"},

// ————————————————————— STATE —————————————————————
var currentLang = localStorage.getItem("ecap_lang") || "zh-Hant";
var CMS_KEY = "ecap_cms_pages";

function getCmsPages(){
  try { var d = JSON.parse(localStorage.getItem(CMS_KEY)); return d || {}; } catch(e){ return {}; }
}
function saveCmsPages(d){ localStorage.setItem(CMS_KEY, JSON.stringify(d)); }

function getPage(slug, lang){
  var cms = getCmsPages();
  if(cms[slug] && cms[slug][lang]) return cms[slug][lang];
  if(SITE.pages[slug] && SITE.pages[slug][lang]) return SITE.pages[slug][lang];
  return null;
}

function T(key){ return (SITE.ui[currentLang] && SITE.ui[currentLang][key]) || key; }

// ————————————————————— NAV BUILD —————————————————————
function buildNavItem(ch){
  if(ch.ext){
    return '<a href="'+esc(ch.ext)+'" target="_blank" rel="noopener">'+esc(ch.label)+'</a>';
  } else if(ch.children){
    var h = '<div class="has-sub"><a href="#">'+esc(ch.label)+' </a><div class="sub-dropdown"><div class="dropdown-inner">';
    ch.children.forEach(function(sub){ h += buildNavItem(sub); });
    h += '</div></div></div>';
    return h;
  } else if(ch.page){
    return '<a href="#/page/'+esc(ch.page)+'" data-spa>'+esc(ch.label)+'</a>';
  }
  return '';
}

function buildNav(){
  var items = SITE.nav[currentLang] || SITE.nav["zh-Hant"];
  var html = "";
  items.forEach(function(item){
    if(item.ext){
      html += '<li><a href="'+esc(item.ext)+'" target="_blank" rel="noopener">'+esc(item.label)+'</a></li>';
    } else if(item.children){
      html += '<li><a href="#">'+esc(item.label)+'</a><div class="dropdown"><div class="dropdown-inner">';
      item.children.forEach(function(ch){ html += buildNavItem(ch); });
      html += '</div></div></li>';
    } else if(item.page){
      html += '<li><a href="#/page/'+esc(item.page)+'" data-spa>'+esc(item.label)+'</a></li>';
    }
  });
  document.getElementById("navLinks").innerHTML = html;
  // Mobile menu
  var mhtml = '<a href="#/" data-spa>'+esc(T("home"))+'</a>';
  function buildMobile(list, depth){
    list.forEach(function(item){
      if(item.ext){
        mhtml += '<a href="'+esc(item.ext)+'" target="_blank" rel="noopener" style="padding-left:'+(12+depth*16)+'px">'+esc(item.label)+'</a>';
      } else if(item.children){
        mhtml += '<a href="#" style="padding-left:'+(12+depth*16)+'px;font-weight:'+(depth===0?'500':'400')+'">'+esc(item.label)+'</a>';
        mhtml += '<div class="mm-sub">';
        buildMobile(item.children, depth+1);
        mhtml += '</div>';
      } else if(item.page){
        mhtml += '<a href="#/page/'+esc(item.page)+'" data-spa style="padding-left:'+(12+depth*16)+'px">'+esc(item.label)+'</a>';
      }
    });
  }
  buildMobile(items, 0);
  document.getElementById("mobileMenu").innerHTML = mhtml;
  // Update top buttons
  var loginBtn = document.querySelector('.nav-cta .btn-o');
  var openBtn = document.querySelector('.nav-cta .btn-p');
  if(loginBtn) loginBtn.textContent = T("nav_login");
  if(openBtn) openBtn.textContent = T("nav_open");
}

// Default password: "admin" — SHA-256 hash below
var ADMIN_HASH = "8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918";
var ADMIN_SESSION_KEY = "ecap_admin_auth";

function isAdminLoggedIn(){ return sessionStorage.getItem(ADMIN_SESSION_KEY) === "1"; }

window._adminLogout = function(){
  sessionStorage.removeItem(ADMIN_SESSION_KEY);
  location.hash = "#/";
};

window._adminLogin = function(e){
  e.preventDefault();
  var pass = document.getElementById("adminPass").value;
  var btn = document.getElementById("loginBtn");
  var errEl = document.getElementById("loginErr");
  btn.disabled = true;
  btn.textContent = "Verifying...";
  // SHA-256 via Web Crypto API
  crypto.subtle.digest("SHA-256", new TextEncoder().encode(pass)).then(function(buf){
    var hash = Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,"0");}).join("");
    if(hash === ADMIN_HASH){
      sessionStorage.setItem(ADMIN_SESSION_KEY, "1");
      route();
    } else {
      errEl.textContent = "Incorrect password. Please try again.";
      btn.disabled = false;
      btn.textContent = "Login";
    }
  });
  return false;
};

// ————————————————————— CMS FUNCTIONS —————————————————————
var _cmsCurrentSlug = null;
var _cmsPreviewOn = false;

window._cmsFilter = function(q){
  q = q.toLowerCase();
  document.querySelectorAll('.cms-page-item').forEach(function(el){
    var slug = el.getAttribute('data-slug') || '';
    el.style.display = slug.toLowerCase().indexOf(q) >= 0 ? '' : 'none';
  });
};

window._cmsTogglePreview = function(){
  _cmsPreviewOn = !_cmsPreviewOn;
  var btn = document.getElementById('previewToggle');
  if(btn) btn.classList.toggle('active', _cmsPreviewOn);
  if(_cmsCurrentSlug) window._cmsEditPage(_cmsCurrentSlug);
};

window._cmsEditPage = function(slug){
  _cmsCurrentSlug = slug;
  var langs = ["zh-Hant","zh-Hans","en"];
  var langNames = {"zh-Hant":"繁體中文","zh-Hans":"简体中文","en":"English"};
  var html = '<h3 style="font-size:20px;font-weight:700;margin-bottom:16px">'+esc(slug)+'</h3>';

  langs.forEach(function(lang){
    var pg = getPage(slug, lang);
    var title = pg ? pg.title : '';
    var body = pg ? pg.body : '';
    html += '<div class="cms-field-group"><h4>'+esc(langNames[lang])+' ('+lang+')</h4>'
      +'<div class="admin-field"><label>Title</label><input type="text" id="cms_t_'+slug+'_'+lang+'" value="'+escAttr(title)+'" oninput="window._cmsLivePreview(\''+slug+'\')"/></div>'
      +'<div class="admin-field"><label>Body (HTML)</label><textarea id="cms_b_'+slug+'_'+lang+'" style="min-height:160px;font-family:monospace;font-size:13px" oninput="window._cmsLivePreview(\''+slug+'\')">'+escHtml(body)+'</textarea></div></div>';
  });

  html += '<div style="display:flex;gap:8px;margin-top:8px">'
    +'<button class="admin-btn primary" onclick="window._cmsSavePage(\''+slug+'\')"> Save Changes</button>'
    +'<a href="#/page/'+esc(slug)+'" target="_blank" class="admin-btn secondary" style="text-decoration:none;display:inline-flex;align-items:center"> View Page</a></div>';

  if(_cmsPreviewOn){
    var previewPg = getPage(slug, currentLang);
    var previewBody = previewPg ? previewPg.body : '<p style="color:var(--text-muted)">No content</p>';
    html += '<div style="margin-top:24px"><div class="cms-preview-label"> Live Preview ('+currentLang+')</div>'
      +'<div class="cms-preview-panel"><div class="subpage-body" id="cmsPreviewBody">'+previewBody+'</div></div></div>';
  }

  document.getElementById("cmsEditor").innerHTML = html;

  // Highlight active page in sidebar
  document.querySelectorAll('.cms-page-item').forEach(function(el){
    el.classList.toggle('active', el.getAttribute('data-slug') === slug);
  });
};

window._cmsLivePreview = function(slug){
  if(!_cmsPreviewOn) return;
  var tEl = document.getElementById("cms_t_"+slug+"_"+currentLang);
  var bEl = document.getElementById("cms_b_"+slug+"_"+currentLang);
  var preview = document.getElementById("cmsPreviewBody");
  if(bEl && preview) preview.innerHTML = bEl.value;
};

window._cmsSavePage = function(slug){
  var cms = getCmsPages();
  if(!cms[slug]) cms[slug] = {};
  ["zh-Hant","zh-Hans","en"].forEach(function(lang){
    var tEl = document.getElementById("cms_t_"+slug+"_"+lang);
    var bEl = document.getElementById("cms_b_"+slug+"_"+lang);
    if(tEl && bEl){
      cms[slug][lang] = { title: tEl.value, body: bEl.value };
    }
  });
  saveCmsPages(cms);
  showToast("Saved: " + slug);
  // Mark sidebar item as edited
  document.querySelectorAll('.cms-page-item').forEach(function(el){
    if(el.getAttribute('data-slug') === slug) el.classList.add('edited');
  });
};

window._cmsExport = function(){
  var cms = getCmsPages();
  // Merge with defaults for full export
  var full = JSON.parse(JSON.stringify(SITE.pages));
  Object.keys(cms).forEach(function(slug){
    if(!full[slug]) full[slug] = {};
    Object.keys(cms[slug]).forEach(function(lang){
      full[slug][lang] = cms[slug][lang];
    });
  });
  var blob = new Blob([JSON.stringify(full, null, 2)], {type:"application/json"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "ecapital-cms-"+new Date().toISOString().slice(0,10)+".json";
  a.click();
  URL.revokeObjectURL(a.href);
  showToast("Exported JSON");
};

window._cmsImport = function(e){
  var file = e.target.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(ev){
    try {
      var data = JSON.parse(ev.target.result);
      saveCmsPages(data);
      showToast("Imported successfully");
      route();
    } catch(err){ showToast("Invalid JSON file"); }
  };
  reader.readAsText(file);
  e.target.value = "";
};

window._cmsReset = function(){
  if(confirm("Reset all CMS edits to default?")) {
    localStorage.removeItem(CMS_KEY);
    showToast("Reset to defaults");
    route();
  }
};

}

// ————————————————————— ROUTER —————————————————————
function route(){
  var hash = location.hash || "#/";
  var app = document.getElementById("app");
  buildNav();
  closeMobile();

  if(hash === "#/" || hash === "#" || hash === ""){
    app.innerHTML = homeView() + footerView();
    window.scrollTo(0,0);
  } else if(hash.indexOf("#/page/") === 0){
    var slug = hash.replace("#/page/","").split("?")[0];
    app.innerHTML = pageView(slug) + footerView();
    window.scrollTo(0,0);
  } else if(hash === "#/admin"){
    app.innerHTML = adminView();
    window.scrollTo(0,0);
  } else {
    app.innerHTML = '<section class="subpage"><div class="mw"><h1>404</h1><p><a href="#/" data-spa>'+esc(T("home"))+'</a></p></div></section>' + footerView();
  }

  // Update lang highlight
  document.querySelectorAll('[data-lang]').forEach(function(el){
    el.classList.toggle('active', el.getAttribute('data-lang') === currentLang);
  });
  // Update html lang
  document.documentElement.lang = currentLang === "zh-Hans" ? "zh-Hans" : currentLang === "en" ? "en" : "zh-Hant";
}

// ————————————————————— EVENTS —————————————————————
window.addEventListener("hashchange", route);

// Language switch
document.addEventListener("click", function(e){
  var langEl = e.target.closest("[data-lang]");
  if(langEl){
    e.preventDefault();
    currentLang = langEl.getAttribute("data-lang");
    localStorage.setItem("ecap_lang", currentLang);
    route();
    return;
  }
  // SPA link
  var spaLink = e.target.closest("[data-spa]");
  if(spaLink){
    closeMobile();
  }
});

// Nav scroll
var nav = document.getElementById("mainNav");
var navScrolled = false;
window.addEventListener("scroll", function(){
  var y = window.scrollY || window.pageYOffset;
  if(y > 40 && !navScrolled){ nav.classList.add("scrolled"); navScrolled = true; }
  else if(y <= 40 && navScrolled){ nav.classList.remove("scrolled"); navScrolled = false; }
}, {passive:true});

// Hamburger
document.getElementById("navHam").addEventListener("click", function(){
  document.getElementById("mobileMenu").classList.toggle("open");
});
function closeMobile(){ document.getElementById("mobileMenu").classList.remove("open"); }

// ————————————————————— UTIL —————————————————————
function esc(s){ if(!s) return ""; var d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
function escAttr(s){ return esc(s).replace(/"/g,"&quot;"); }
function escHtml(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function showToast(msg){
  var t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  setTimeout(function(){ t.classList.remove("show"); }, 2500);
}

// ————————————————————— INIT —————————————————————
route();
nav.classList.add("scrolled"); // init check

})();
</script>
